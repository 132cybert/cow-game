<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>职场模拟器：从实习生到诸天万界总裁</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #gameInfo {
      position: absolute;
      top: 20px;
      width: 90%;
      max-width: 880px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      background: rgba(255, 255, 255, 0.15);
      padding: 14px 22px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #e0f7fa;
      font-size: 16px;
      font-weight: bold;
      z-index: 10;
      flex-wrap: wrap;
    }

    #gameCanvas {
      border: 2px solid rgba(173, 216, 230, 0.5);
      border-radius: 15px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      background: rgba(255, 255, 255, 0.05);
      touch-action: none;
    }

    /* 对话框 */
    #dialogBox {
      position: absolute;
      bottom: 88px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #e0f7fa;
      padding: 14px 22px;
      border-radius: 20px;
      font-size: 16px;
      max-width: min(880px, 78%);
      text-align: center;
      display: none;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 20px rgba(0, 200, 255, 0.35);
      border: 1px solid rgba(255,255,255,0.16);
      line-height: 1.45;
      z-index: 50;
      user-select: none;
    }

    /* 奶瓶托盘（右下角） */
    #milkTray {
      position: absolute;
      right: 20px;
      bottom: 22px;
      display: flex;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.16);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      z-index: 60;
      align-items: center;
      user-select: none;
    }

    .milk {
      width: 18px;
      height: 26px;
      border-radius: 6px 6px 8px 8px;
      background: rgba(255,255,255,0.9);
      position: relative;
      box-shadow: 0 0 10px rgba(255,255,255,0.25);
      border: 1px solid rgba(0,0,0,0.08);
      flex: 0 0 auto;
      opacity: 0;
      transform: translateY(6px);
      animation: milkIn 220ms ease-out forwards;
    }

    .milk::before {
      content: "";
      position: absolute;
      width: 10px;
      height: 6px;
      border-radius: 8px 8px 6px 6px;
      background: rgba(255,255,255,0.95);
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      border: 1px solid rgba(0,0,0,0.08);
    }

    .milk::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 10px;
      border-radius: 6px;
      background: rgba(135, 206, 235, 0.35);
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
    }

    .milk.out {
      animation: milkOut 260ms ease-in forwards;
    }

    @keyframes milkIn {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes milkOut {
      to { opacity: 0; transform: translateY(6px); }
    }

    #gameOverPanel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(30, 30, 50, 0.9);
      padding: 40px;
      border-radius: 25px;
      text-align: center;
      display: none;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      z-index: 100;
      min-width: 360px;
    }

    #gameOverPanel h2 {
      color: #e0f7fa;
      font-size: 28px;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(0, 200, 255, 0.7);
      line-height: 1.25;
    }

    #gameOverPanel .subtitle {
      color: rgba(224, 247, 250, 0.8);
      font-size: 13px;
      margin-bottom: 18px;
      letter-spacing: 0.2px;
    }

    #gameOverPanel p {
      color: #bbdefb;
      font-size: 18px;
      margin: 10px 0;
    }

    #restartBtn {
      margin-top: 22px;
      padding: 14px 38px;
      font-size: 16px;
      background: linear-gradient(45deg, #00c9ff, #92fe9d);
      color: #0a1929;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.25s;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(0, 201, 255, 0.4);
    }

    #restartBtn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(0, 201, 255, 0.6);
    }
  </style>
</head>

<body>
  <div id="gameInfo">
    <div>剩余寿命: <span id="daysLeft">21346</span> 天</div>
    <div>生命值(HP): <span id="hp">120</span></div>
    <div>难度: <span id="difficulty">1</span></div>
    <div>金币积分: <span id="coinScore">0</span></div>
  </div>

  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <div id="dialogBox"></div>

  <div id="milkTray" title="认真工作中：不断挤奶（挂机升级）"></div>

  <div id="gameOverPanel">
    <h2>职场模拟器：本轮历练结束</h2>
    <div class="subtitle">Corporate Ascension Simulator — From Intern to Multiverse CEO</div>
    <p>最终得分: <span id="finalScore">0</span></p>
    <p>金币积分: <span id="finalCoins">0</span></p>
    <p>存活时长: <span id="finalSeconds">0</span> 秒</p>
    <button id="restartBtn">重新开始</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameOverPanel = document.getElementById('gameOverPanel');
    const restartBtn = document.getElementById('restartBtn');
    const dialogBox = document.getElementById('dialogBox');
    const milkTray = document.getElementById('milkTray');

    // =========================
    // 你的台词（已替换为你提供的版本）
    // =========================
    const earlyLines = [
      "第一天上班……",
      "为什么空气这么压抑？",
      "我是不是选错专业了？",
      "再坚持一下……也许明年会涨薪。",
      "今天又要加班吗？",
      "困死了，乌乌。",
      "好想回家。",
      "只有我不会吗？",
      "大家都会，我也学学吧。",
      "好累……但不敢停。",
      "先活下来再说。",
      "我开始收集变量。",
      "我今天帮刘姐做了她的活！嘿嘿。",
      "今天不加班，好开心。",
      "怎么又改需求？",
      "我只是个实习生啊……",
      "同事会拍马屁，升职好快。",
      "会议像黑洞：吞噬时间，吐出KPI。"
    ];

    const midLines = [
      "原来权力，是结构。",
      "想回家。",
      "我燃尽了……",
      "马年快乐",
      "为什么抢我的功劳？",
      "原来不是我不行，是游戏有问题。",
      "我不再焦虑，我开始计算。",
      "资源流向强者。",
      "八嘎呀路！",
      "小猫咪！嘬嘬嘬",
      "实习生！嘬嘬嘬",
      "王总，这个方案这样做更好。",
      "我开始收集变量。",
      "呵呵。",
      "耐心，是我的武器。",
      "当我不再解释，我就开始赢。"
    ];

    const lateLines = [
      "五年前，我在底层挨耳光；五年后，总经理为我擦皮鞋——这一巴掌，利息十亿。",
      "哈哈哈哈哈哈哈哈哈哈哈哈！",
      "抽中了年会特等奖：总裁体验卡（永久）。",
      "【恭喜宿主完成十万次摸鱼签到，奖励：整个集团控股权】",
      "带薪拉屎的我，拉出一座商业帝国。",
      "这栋楼太小，本座的目标是收购因果律。",
      "本座之言，便是群公告；本座之怒，便是服务器崩溃！",
      "我即天道，我即规则，我即职场本身！",
      "签到一百年，我成了职场天道。",
      "天若阻我，我便不出门；地若拦我，我便收购这地！",
      "我有一剑，可斩星辰；我有一键，可让全楼断电！",
      "被裁员那天，我绑定了职场神豪系统。"
    ];

    // =========================
    // 核心数值与节奏（休闲化）
    // =========================
    const INITIAL_DAYS = 21346;

    const MAX_HP = 140;      // 更肉一些
    const INITIAL_HP = 120;

    // HP更不容易掉（休闲）
    const SMALL_DAMAGE = 4;
    const BOSS_DAMAGE  = 9;

    // 击杀回血（更轻松）
    const SMALL_HEAL = 10;
    const BOSS_HEAL  = 28;

    // 金币指数级增长参数（随难度指数增长）
    // 最终金币 = base * growth^(difficulty-1) （再乘怪物系数）
    const COIN_GROWTH = 1.18;
    const SMALL_COIN_BASE = 2;
    const BOSS_COIN_BASE  = 8;

    // 出怪指数级增长：spawnChance ≈ base * growth^t（上限封顶）
    const SPAWN_BASE = 0.012;     // 初期
    const SPAWN_GROWTH = 1.035;   // 越后期越密
    const SPAWN_CAP = 0.35;       // 上限，防止崩

    // 寿命指数级减少：早期慢，后期快
    // 每秒扣 daysDecay = base * growth^(minutes)
    const DAYS_DECAY_BASE = 0.15;     // 早期非常慢
    const DAYS_DECAY_GROWTH = 1.22;   // 每“分钟”倍率
    const DAYS_DECAY_CAP = 35;        // 每秒最多扣这么多天（防止一下清零）

    // 敌人行为分布
    // 追主角 / 随机游走 / 远离主角
    const AI_SEEK_RATIO  = 0.55;
    const AI_WANDER_RATIO = 0.25;
    const AI_FLEE_RATIO  = 0.20;

    // 对话频率
    let lastDialogTime = 0;
    const DIALOG_MIN_INTERVAL_MS = 6500;
    const DIALOG_SHOW_MS = 3000;
    let dialogHideTimer = null;

    // =========================
    // 游戏状态
    // =========================
    let player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      size: 30,
      speed: 5,
      targetX: canvas.width / 2,
      targetY: canvas.height / 2,
      // 表情
      mood: "calm",          // calm|tired|critical|happy|blink
      happyUntil: 0,
      blinkUntil: 0,
      // 小表情：脸红/爱心概率
      cutePulse: 0
    };

    let enemies = [];
    let particles = [];
    let coinsFx = [];       // 仅视觉金币粒子（喷射）
    let floatTexts = [];    // 浮动文字

    let daysLeft = INITIAL_DAYS;   // 倒数
    let hp = INITIAL_HP;
    let score = 0;
    let coinScore = 0;
    let difficulty = 1;
    let gameRunning = true;

    let lastSecondTick = performance.now();
    let secondsSurvived = 0;

    // 奶瓶队列：右下角不断出现 & 从另一端消失
    const MILK_MAX = 12;
    let milkLastAdd = performance.now();
    const MILK_ADD_INTERVAL_MS = 520;  // 出现频率
    const MILK_REMOVE_INTERVAL_MS = 760; // 消失频率
    let milkLastRemove = performance.now();

    // =========================
    // 工具函数
    // =========================
    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
    function rand(min, max) { return Math.random() * (max - min) + min; }

    // =========================
    // 对话系统
    // =========================
    function showDialog(text) {
      if (dialogHideTimer) clearTimeout(dialogHideTimer);
      dialogBox.textContent = text;
      dialogBox.style.display = "block";
      dialogHideTimer = setTimeout(() => {
        dialogBox.style.display = "none";
      }, DIALOG_SHOW_MS);
    }

    function randomLine(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function updateDialog() {
      const now = performance.now();
      if (now - lastDialogTime < DIALOG_MIN_INTERVAL_MS) return;

      // 越后期“天道发言”更有仪式感：减少概率
      const chance = secondsSurvived < 60 ? 0.75 : (secondsSurvived < 180 ? 0.62 : 0.45);
      if (Math.random() > chance) return;

      if (secondsSurvived < 60) showDialog(randomLine(earlyLines));
      else if (secondsSurvived < 180) showDialog(randomLine(midLines));
      else showDialog(randomLine(lateLines));

      lastDialogTime = now;
    }

    // =========================
    // 奶瓶托盘
    // =========================
    function addMilkBottle() {
      const el = document.createElement("div");
      el.className = "milk";
      milkTray.appendChild(el);

      // 超过上限，就把最早的标记为 out，然后移除
      while (milkTray.children.length > MILK_MAX) {
        const first = milkTray.children[0];
        first.classList.add("out");
        setTimeout(() => {
          if (first && first.parentNode) first.parentNode.removeChild(first);
        }, 260);
      }
    }

    function removeMilkBottleFromEnd() {
      const n = milkTray.children.length;
      if (n <= 0) return;
      const last = milkTray.children[n - 1];
      last.classList.add("out");
      setTimeout(() => {
        if (last && last.parentNode) last.parentNode.removeChild(last);
      }, 260);
    }

    function updateMilkTray() {
      const now = performance.now();

      // 不断出现（从一端出现）
      if (now - milkLastAdd >= MILK_ADD_INTERVAL_MS) {
        milkLastAdd = now;
        // 小概率跳过，避免太机械
        if (Math.random() < 0.9) addMilkBottle();
      }

      // 不断消失（从另一端消失：这里从末端消失）
      if (now - milkLastRemove >= MILK_REMOVE_INTERVAL_MS) {
        milkLastRemove = now;
        if (Math.random() < 0.85) removeMilkBottleFromEnd();
      }
    }

    // =========================
    // 绘制：奶牛（更可爱明显的表情变化）
    // =========================
    function drawCow(x, y, size, mood) {
      // 身体
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(x, y, size, size * 0.8, 0, 0, Math.PI * 2);
      ctx.fill();

      // 斑点
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.ellipse(x - size * 0.32, y - size * 0.18, size * 0.16, size * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + size * 0.18, y + size * 0.30, size * 0.22, size * 0.16, 0, 0, Math.PI * 2);
      ctx.fill();

      // 头
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(x, y - size * 0.7, size * 0.72, size * 0.62, 0, 0, Math.PI * 2);
      ctx.fill();

      // 根据表情决定眼睛形状
      const now = performance.now();
      const isBlink = now < player.blinkUntil;
      let eyeH = size * 0.06;
      if (mood === "tired") eyeH = size * 0.035;
      if (mood === "critical") eyeH = size * 0.022;
      if (mood === "happy") eyeH = size * 0.04;
      if (isBlink) eyeH = size * 0.012;

      const eyeW = size * 0.09;
      const eyeY = y - size * 0.82;

      // 眼睛
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.ellipse(x - size * 0.30, eyeY, eyeW, eyeH, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + size * 0.30, eyeY, eyeW, eyeH, 0, 0, Math.PI * 2);
      ctx.fill();

      // 眼袋/疲惫线
      if (mood === "tired" || mood === "critical") {
        ctx.strokeStyle = 'rgba(0,0,0,0.35)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x - size * 0.30, eyeY + size * 0.10, size * 0.10, 0, Math.PI);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x + size * 0.30, eyeY + size * 0.10, size * 0.10, 0, Math.PI);
        ctx.stroke();
      }

      // 可爱：脸红（happy 或者随机可爱脉冲）
      const blushOn = (mood === "happy") || (player.cutePulse > 0.6);
      if (blushOn) {
        ctx.fillStyle = 'rgba(255, 105, 180, 0.35)';
        ctx.beginPath();
        ctx.ellipse(x - size * 0.45, y - size * 0.62, size * 0.18, size * 0.12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(x + size * 0.45, y - size * 0.62, size * 0.18, size * 0.12, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // 嘴巴
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2;
      ctx.beginPath();
      if (mood === "happy") {
        // 大一点的笑
        ctx.arc(x, y - size * 0.60, size * 0.24, 0, Math.PI);
      } else if (mood === "critical") {
        // 苦脸
        ctx.arc(x, y - size * 0.52, size * 0.22, Math.PI, Math.PI * 2);
      } else if (mood === "tired") {
        // 平直
        ctx.moveTo(x - size * 0.26, y - size * 0.58);
        ctx.lineTo(x + size * 0.26, y - size * 0.58);
      } else {
        // calm 小微笑
        ctx.arc(x, y - size * 0.60, size * 0.16, 0, Math.PI);
      }
      ctx.stroke();

      // 耳朵
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(x - size * 0.52, y - size * 0.92, size * 0.22, size * 0.32, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + size * 0.52, y - size * 0.92, size * 0.22, size * 0.32, 0.5, 0, Math.PI * 2);
      ctx.fill();

      // 角
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x - size * 0.22, y - size * 1.1);
      ctx.lineTo(x - size * 0.16, y - size * 1.32);
      ctx.moveTo(x + size * 0.22, y - size * 1.1);
      ctx.lineTo(x + size * 0.16, y - size * 1.32);
      ctx.stroke();

      // 可爱小爱心（低概率）
      if (mood === "happy" && Math.random() < 0.02) {
        drawHeart(x + size * 1.15, y - size * 1.10, 9, 'rgba(255,105,180,0.75)');
      }
    }

    function drawHeart(x, y, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.bezierCurveTo(x - r, y - r, x - 2*r, y + r/2, x, y + 2*r);
      ctx.bezierCurveTo(x + 2*r, y + r/2, x + r, y - r, x, y);
      ctx.fill();
    }

    // 小马敌人
    function drawHorse(x, y, size) {
      ctx.fillStyle = '#8B4513';
      ctx.beginPath();
      ctx.ellipse(x, y, size * 0.8, size * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(x, y - size * 0.6, size * 0.5, size * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#654321';
      ctx.beginPath();
      ctx.ellipse(x, y - size * 0.8, size * 0.6, size * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.ellipse(x - size * 0.2, y - size * 0.7, size * 0.06, size * 0.08, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + size * 0.2, y - size * 0.7, size * 0.06, size * 0.08, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#8B4513';
      ctx.lineWidth = size * 0.15;
      ctx.beginPath();
      ctx.moveTo(x - size * 0.3, y + size * 0.3);
      ctx.lineTo(x - size * 0.3, y + size * 0.8);
      ctx.moveTo(x + size * 0.3, y + size * 0.3);
      ctx.lineTo(x + size * 0.3, y + size * 0.8);
      ctx.stroke();
    }

    // Boss
    function drawBoss(x, y, size) {
      ctx.fillStyle = '#FF6B6B';
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FF0000';
      ctx.beginPath();
      ctx.ellipse(x - size * 0.4, y - size * 0.2, size * 0.15, size * 0.2, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + size * 0.4, y - size * 0.2, size * 0.15, size * 0.2, 0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#8B0000';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x - size * 0.6, y - size * 0.4);
      ctx.lineTo(x - size * 0.2, y - size * 0.3);
      ctx.moveTo(x + size * 0.6, y - size * 0.4);
      ctx.lineTo(x + size * 0.2, y - size * 0.3);
      ctx.stroke();

      ctx.strokeStyle = '#8B0000';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(x, y + size * 0.2, size * 0.3, 0, Math.PI);
      ctx.stroke();
    }

    // 视觉金币（喷射）
    function drawCoin(x, y, size) {
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FFA500';
      ctx.beginPath();
      ctx.arc(x, y, size * 0.7, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FFD700';
      ctx.font = `bold ${size}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('¥', x, y);
    }

    // 粒子/金币/浮字
    function createParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10,
          size: Math.random() * 5 + 2,
          color,
          life: 1
        });
      }
    }

    function createCoinsFx(x, y, n = 5) {
      for (let i = 0; i < n; i++) {
        coinsFx.push({
          x, y,
          vx: (Math.random() - 0.5) * 5,
          vy: -Math.random() * 5 - 2,
          size: 14,
          life: 1
        });
      }
    }

    function addFloatText(x, y, text, color = "#e0f7fa") {
      floatTexts.push({
        x, y,
        text,
        color,
        vy: -1.2,
        life: 1
      });
    }

    function updateParticles() {
      particles = particles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.5;
        p.life -= 0.02;
        p.size *= 0.98;
        return p.life > 0;
      });
    }

    function updateCoinsFx() {
      coinsFx = coinsFx.filter(c => {
        c.x += c.vx;
        c.y += c.vy;
        c.vy += 0.3;
        c.life -= 0.012;
        return c.life > 0;
      });
    }

    function updateFloatTexts() {
      floatTexts = floatTexts.filter(t => {
        t.y += t.vy;
        t.life -= 0.02;
        return t.life > 0;
      });
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function drawCoinsFx() {
      coinsFx.forEach(c => {
        ctx.globalAlpha = c.life;
        drawCoin(c.x, c.y, c.size);
      });
      ctx.globalAlpha = 1;
    }

    function drawFloatTexts() {
      floatTexts.forEach(t => {
        ctx.globalAlpha = t.life;
        ctx.fillStyle = t.color;
        ctx.font = "bold 16px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(t.text, t.x, t.y);
      });
      ctx.globalAlpha = 1;
    }

    // =========================
    // 敌人AI：seek / wander / flee
    // =========================
    function pickAIType() {
      const r = Math.random();
      if (r < AI_SEEK_RATIO) return "seek";
      if (r < AI_SEEK_RATIO + AI_WANDER_RATIO) return "wander";
      return "flee";
    }

    function spawnEnemy() {
      const side = Math.floor(Math.random() * 4);
      let x, y;
      switch (side) {
        case 0: x = Math.random() * canvas.width; y = -50; break;
        case 1: x = canvas.width + 50; y = Math.random() * canvas.height; break;
        case 2: x = Math.random() * canvas.width; y = canvas.height + 50; break;
        case 3: x = -50; y = Math.random() * canvas.height; break;
      }

      const isBoss = Math.random() < 0.08;
      const aiType = pickAIType();

      // wander 需要一个随机目标点
      const wanderTarget = {
        x: rand(0, canvas.width),
        y: rand(0, canvas.height),
        ttl: rand(30, 90) // 帧数后换目标
      };

      enemies.push({
        x, y,
        size: isBoss ? 40 : 25,
        speed: isBoss ? 2.0 : (2.6 + difficulty * 0.12),
        isBoss,
        hp: isBoss ? 3 : 1,
        aiType,
        wanderTarget
      });
    }

    // =========================
    // 金币奖励：指数级增长
    // =========================
    function coinReward(isBoss) {
      const base = isBoss ? BOSS_COIN_BASE : SMALL_COIN_BASE;
      const mult = Math.pow(COIN_GROWTH, Math.max(0, difficulty - 1));
      // boss再加一点“爽感”
      const kind = isBoss ? 1.55 : 1.0;
      return Math.max(1, Math.round(base * mult * kind));
    }

    // =========================
    // 击杀奖励 & 轻松玩法
    // =========================
    function rewardForKill(isBoss, x, y) {
      const rewardCoin = coinReward(isBoss);

      if (isBoss) {
        hp = clamp(hp + BOSS_HEAL, 0, MAX_HP);
        score += 120;
        coinScore += rewardCoin;

        createParticles(x, y, '#FFD700', 34);
        createCoinsFx(x, y, 10);
        addFloatText(x, y - 10, `+${BOSS_HEAL} HP`, "#92fe9d");
        addFloatText(x, y + 12, `+${rewardCoin} 金币`, "#FFD700");
      } else {
        hp = clamp(hp + SMALL_HEAL, 0, MAX_HP);
        score += 12;
        coinScore += rewardCoin;

        createParticles(x, y, '#00FF88', 20);
        createCoinsFx(x, y, 6);
        addFloatText(x, y - 10, `+${SMALL_HEAL} HP`, "#92fe9d");
        addFloatText(x, y + 12, `+${rewardCoin} 金币`, "#FFD700");
      }

      // 开心一会儿
      player.happyUntil = performance.now() + 900;
      // 眨眼/卖萌
      player.blinkUntil = performance.now() + 240;
    }

    // =========================
    // 表情逻辑：更可爱更明显
    // =========================
    function updateMood() {
      const now = performance.now();

      // 随机眨眼（更明显）
      if (Math.random() < 0.015) {
        player.blinkUntil = now + 220;
      }

      // 可爱脉冲：偶尔脸红/小心情
      player.cutePulse = 0.92 * player.cutePulse + 0.08 * Math.random();

      if (now < player.happyUntil) {
        player.mood = "happy";
        return;
      }

      const hpRatio = hp / MAX_HP;
      if (hp <= 22) player.mood = "critical";
      else if (hpRatio < 0.45 || difficulty >= 8) player.mood = "tired";
      else player.mood = "calm";
    }

    // =========================
    // 寿命指数级减少（时光飞逝）
    // =========================
    function daysDecayPerSecond() {
      const minutes = secondsSurvived / 60;
      const raw = DAYS_DECAY_BASE * Math.pow(DAYS_DECAY_GROWTH, minutes);
      return Math.min(DAYS_DECAY_CAP, raw);
    }

    // =========================
    // 出怪指数级增长（密度越来越大）
    // =========================
    function spawnChancePerFrame() {
      // 以“秒”为基准增长更直观：chance(t) = base * growth^seconds
      // 但每帧用的话会太爆，所以用 sqrt(seconds) 作为“慢指数”，再配合 cap
      const t = Math.max(0, secondsSurvived);
      const scaled = SPAWN_BASE * Math.pow(SPAWN_GROWTH, Math.sqrt(t));
      return Math.min(SPAWN_CAP, scaled);
    }

    // =========================
    // 更新游戏
    // =========================
    function update() {
      if (!gameRunning) return;

      const now = performance.now();

      // 1) 每秒tick：寿命倒数（指数加速）
      if (now - lastSecondTick >= 1000) {
        const secs = Math.floor((now - lastSecondTick) / 1000);
        secondsSurvived += secs;
        lastSecondTick += secs * 1000;

        const decay = daysDecayPerSecond();
        daysLeft -= decay * secs;
        if (daysLeft < 0) daysLeft = 0;
      }

      // 2) 玩家移动
      const dxp = player.targetX - player.x;
      const dyp = player.targetY - player.y;
      const distp = Math.sqrt(dxp * dxp + dyp * dyp);
      if (distp > 5) {
        player.x += (dxp / distp) * player.speed;
        player.y += (dyp / distp) * player.speed;
      }

      // 3) 敌人移动 + 碰撞（多种AI）
      enemies.forEach((enemy, index) => {
        let dx = 0, dy = 0;

        if (enemy.aiType === "seek") {
          dx = player.x - enemy.x;
          dy = player.y - enemy.y;
        } else if (enemy.aiType === "flee") {
          dx = enemy.x - player.x;
          dy = enemy.y - player.y;
        } else {
          // wander：朝随机目标走，ttl 到了就换
          enemy.wanderTarget.ttl -= 1;
          if (enemy.wanderTarget.ttl <= 0) {
            enemy.wanderTarget.x = rand(0, canvas.width);
            enemy.wanderTarget.y = rand(0, canvas.height);
            enemy.wanderTarget.ttl = rand(30, 90);
          }
          dx = enemy.wanderTarget.x - enemy.x;
          dy = enemy.wanderTarget.y - enemy.y;
        }

        const distance = Math.sqrt(dx * dx + dy * dy) || 1;

        // flee 如果太靠近边缘就调头（避免一直跑出屏幕）
        if (enemy.aiType === "flee") {
          const margin = 60;
          if (enemy.x < -margin || enemy.x > canvas.width + margin || enemy.y < -margin || enemy.y > canvas.height + margin) {
            enemy.aiType = "wander";
            enemy.wanderTarget.x = rand(0, canvas.width);
            enemy.wanderTarget.y = rand(0, canvas.height);
            enemy.wanderTarget.ttl = rand(45, 120);
          }
        }

        enemy.x += (dx / distance) * enemy.speed;
        enemy.y += (dy / distance) * enemy.speed;

        // 碰撞判定（只对 seek / wander 的更“合理”；flee也可能误撞）
        const px = player.x - enemy.x;
        const py = player.y - enemy.y;
        const pd = Math.sqrt(px * px + py * py);

        if (pd < player.size + enemy.size) {
          // 休闲：扣血更少
          hp -= enemy.isBoss ? BOSS_DAMAGE : SMALL_DAMAGE;
          hp = clamp(hp, 0, MAX_HP);

          if (enemy.isBoss) {
            enemy.hp--;
            if (enemy.hp <= 0) {
              rewardForKill(true, enemy.x, enemy.y);
              enemies.splice(index, 1);
            }
          } else {
            rewardForKill(false, enemy.x, enemy.y);
            enemies.splice(index, 1);
          }
        }
      });

      // 4) 难度：用存活时间 + 得分综合（更“升级”）
      difficulty = Math.max(1, Math.floor(score / 120) + Math.floor(secondsSurvived / 18) + 1);

      // 5) 出怪：指数级越来越密
      const spawnChance = spawnChancePerFrame();
      if (Math.random() < spawnChance) spawnEnemy();

      // 6) 奶瓶托盘（右下角）
      updateMilkTray();

      // 7) 视觉效果更新
      updateParticles();
      updateCoinsFx();
      updateFloatTexts();
      updateMood();
      updateDialog();

      // 8) UI
      document.getElementById('daysLeft').textContent = Math.floor(daysLeft);
      document.getElementById('hp').textContent = Math.floor(hp);
      document.getElementById('difficulty').textContent = difficulty;
      document.getElementById('coinScore').textContent = coinScore;

      // 9) 结束：寿命归零 或 HP归零
      if (daysLeft <= 0 || hp <= 0) gameOver();
    }

    // =========================
    // 绘制
    // =========================
    function draw() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 轻微“忙碌汗滴”
      if ((player.mood === "tired" || player.mood === "critical") && Math.random() < 0.28) {
        ctx.fillStyle = '#87CEEB';
        ctx.beginPath();
        ctx.arc(player.x - player.size * 0.82, player.y - player.size * 0.52, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      // 玩家
      drawCow(player.x, player.y, player.size, player.mood);

      // 敌人
      enemies.forEach(enemy => {
        if (enemy.isBoss) drawBoss(enemy.x, enemy.y, enemy.size);
        else drawHorse(enemy.x, enemy.y, enemy.size);
      });

      // 视觉层
      drawParticles();
      drawCoinsFx();
      drawFloatTexts();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // =========================
    // 结束/重开
    // =========================
    function gameOver() {
      gameRunning = false;
      document.getElementById('finalScore').textContent = score;
      document.getElementById('finalCoins').textContent = coinScore;
      document.getElementById('finalSeconds').textContent = secondsSurvived;
      gameOverPanel.style.display = 'block';
    }

    function restart() {
      player.x = canvas.width / 2;
      player.y = canvas.height / 2;
      player.targetX = canvas.width / 2;
      player.targetY = canvas.height / 2;
      player.mood = "calm";
      player.happyUntil = 0;
      player.blinkUntil = 0;
      player.cutePulse = 0;

      enemies = [];
      particles = [];
      coinsFx = [];
      floatTexts = [];

      daysLeft = INITIAL_DAYS;
      hp = INITIAL_HP;
      score = 0;
      coinScore = 0;
      difficulty = 1;
      secondsSurvived = 0;

      lastSecondTick = performance.now();
      lastDialogTime = 0;
      dialogBox.style.display = "none";
      if (dialogHideTimer) {
        clearTimeout(dialogHideTimer);
        dialogHideTimer = null;
      }

      // 清空奶瓶托盘
      while (milkTray.firstChild) milkTray.removeChild(milkTray.firstChild);
      milkLastAdd = performance.now();
      milkLastRemove = performance.now();

      gameRunning = true;
      gameOverPanel.style.display = 'none';
    }

    // =========================
    // 输入控制
    // =========================
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      player.targetX = e.clientX - rect.left;
      player.targetY = e.clientY - rect.top;
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      player.targetX = touch.clientX - rect.left;
      player.targetY = touch.clientY - rect.top;
    }, { passive: false });

    restartBtn.addEventListener('click', restart);

    // 开始
    gameLoop();
  </script>
</body>
</html>
