<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>职场模拟器：从实习生到诸天万界总裁</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #gameInfo {
      position: absolute;
      top: 20px;
      width: 90%;
      max-width: 880px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      background: rgba(255, 255, 255, 0.15);
      padding: 14px 22px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #e0f7fa;
      font-size: 16px;
      font-weight: bold;
      z-index: 10;
      flex-wrap: wrap;
    }

    #gameCanvas {
      border: 2px solid rgba(173, 216, 230, 0.5);
      border-radius: 15px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      background: rgba(255, 255, 255, 0.05);
      touch-action: none;
    }

    /* 对话框 */
    #dialogBox {
      position: absolute;
      bottom: 78px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #e0f7fa;
      padding: 14px 22px;
      border-radius: 20px;
      font-size: 16px;
      max-width: min(860px, 78%);
      text-align: center;
      display: none;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 20px rgba(0, 200, 255, 0.35);
      border: 1px solid rgba(255,255,255,0.16);
      line-height: 1.45;
      z-index: 50;
      user-select: none;
    }

    /* 奶瓶工作条 */
    #milkBar {
      position: absolute;
      right: 18px;
      bottom: 18px;
      display: flex;
      gap: 8px;
      z-index: 60;
      user-select: none;
      pointer-events: none;
      filter: drop-shadow(0 0 10px rgba(0, 200, 255, 0.25));
    }

    .milk {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.18);
      display: grid;
      place-items: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      opacity: 0;
      transform: translateY(6px) scale(0.96);
      transition: opacity 350ms ease, transform 350ms ease;
      font-size: 18px;
    }
    .milk.on {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    #gameOverPanel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(30, 30, 50, 0.9);
      padding: 40px;
      border-radius: 25px;
      text-align: center;
      display: none;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      z-index: 100;
      min-width: 360px;
    }

    #gameOverPanel h2 {
      color: #e0f7fa;
      font-size: 28px;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(0, 200, 255, 0.7);
      line-height: 1.25;
    }

    #gameOverPanel .subtitle {
      color: rgba(224, 247, 250, 0.8);
      font-size: 14px;
      margin-bottom: 18px;
      letter-spacing: 0.2px;
    }

    #gameOverPanel p {
      color: #bbdefb;
      font-size: 18px;
      margin: 10px 0;
    }

    #restartBtn {
      margin-top: 22px;
      padding: 14px 38px;
      font-size: 16px;
      background: linear-gradient(45deg, #00c9ff, #92fe9d);
      color: #0a1929;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.25s;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(0, 201, 255, 0.4);
    }

    #restartBtn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(0, 201, 255, 0.6);
    }
  </style>
</head>

<body>
  <div id="gameInfo">
    <div>剩余寿命: <span id="daysLeft">21346</span> 天</div>
    <div>生命值(HP): <span id="hp">100</span></div>
    <div>难度: <span id="difficulty">1</span></div>
    <div>金币积分: <span id="coinScore">0</span></div>
  </div>

  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <div id="dialogBox"></div>

  <!-- 奶瓶：右下角，从左往右出现，从右往左消失，最多5个 -->
  <div id="milkBar">
    <div class="milk"><span>🥛</span></div>
    <div class="milk"><span>🥛</span></div>
    <div class="milk"><span>🥛</span></div>
    <div class="milk"><span>🥛</span></div>
    <div class="milk"><span>🥛</span></div>
  </div>

  <div id="gameOverPanel">
    <h2>职场模拟器：本轮历练结束</h2>
    <div class="subtitle">Corporate Ascension Simulator — From Intern to Multiverse CEO</div>
    <p>最终得分: <span id="finalScore">0</span></p>
    <p>金币积分: <span id="finalCoins">0</span></p>
    <p>存活时长: <span id="finalSeconds">0</span> 秒</p>
    <button id="restartBtn">重新开始</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameOverPanel = document.getElementById('gameOverPanel');
    const restartBtn = document.getElementById('restartBtn');
    const dialogBox = document.getElementById('dialogBox');

    // 奶瓶 UI
    const milkEls = Array.from(document.querySelectorAll(".milk"));
    let milkCount = 0;
    let milkAppearTimer = 0;
    let milkVanishTimer = 0;

    // ====== 核心资源：寿命(不可恢复) + HP(可恢复) ======
    const INITIAL_DAYS = 21346;
    const MAX_HP = 100;

    // 让游戏更休闲：扣血更少 + 碰撞有冷却
    const SMALL_DAMAGE = 3;         // 小怪贴脸扣血（更少）
    const BOSS_DAMAGE  = 7;         // Boss贴脸扣血（更少）
    const HIT_COOLDOWN_MS = 420;    // 同一帧擦边也不会疯狂掉血

    // 回血也更舒服
    const SMALL_HEAL = 10;
    const BOSS_HEAL  = 24;

    // 指数金币增长：基础金币 × (1 + growth)^t
    const SMALL_COIN_BASE = 1;
    const BOSS_COIN_BASE  = 4;

    // 寿命指数减少：开始慢，后面越来越快（每秒扣的“天数”随时间指数增长）
    const DAYS_DECAY_BASE_PER_SEC = 0.10; // 早期每秒扣0.10天（很慢）
    const DAYS_DECAY_GROWTH_PER_MIN = 1.075; // 每分钟×1.075，后期飞快

    // ====== 玩家 ======
    let player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      size: 30,
      speed: 5,
      targetX: canvas.width / 2,
      targetY: canvas.height / 2,
      mood: "calm",  // calm | tired | critical | happy | evil
      happyUntil: 0,
      evilUntil: 0
    };

    let enemies = [];
    let particles = [];
    let coinParticles = [];  // 视觉金币粒子
    let floatTexts = [];

    let daysLeft = INITIAL_DAYS;
    let hp = MAX_HP;
    let score = 0;
    let coinScore = 0;
    let difficulty = 1;
    let gameRunning = true;

    // 时间
    let secondsSurvived = 0;
    let lastFrameTime = performance.now();

    // 台词（按你给的新版本）
    const earlyLines = [
      "第一天上班……",
      "为什么空气这么压抑？",
      "我是不是选错专业了？",
      "再坚持一下……也许明年会涨薪。",
      "今天又要加班吗？",
      "困死了，乌乌。",
      "好想回家。",
      "只有我不会吗？",
      "大家都会，我也学学吧。",
      "好累……但不敢停。",
      "先活下来再说。",
      "哞——",
      "我今天帮刘姐做了她的活！嘿嘿。",
      "今天不加班，好开心。",
      "怎么又改需求？",
      "我只是个实习生啊……",
      "同事会拍马屁，升职好快。",
      "会议像黑洞：吞噬时间，吐出KPI。"
    ];

    const midLines = [
      "原来权力，是结构。",
      "想回家。",
      "我燃尽了……",
      "马年快乐",
      "为什么抢我的功劳？",
      "原来不是我不行，是游戏有问题。",
      "我不再焦虑，我开始计算。",
      "资源流向强者。",
      "八嘎呀路！",
      "小猫咪！嘬嘬嘬",
      "实习生！嘬嘬嘬",
      "王总，这个方案这样做更好。",
      "我开始收集变量。",
      "呵呵。",
      "耐心，是我的武器。",
      "当我不再解释，我就开始赢。"
    ];

    const lateLines = [
      "五年前，我在底层挨耳光；五年后，总经理为我擦皮鞋——这一巴掌，利息十亿。",
      "哈哈哈哈哈哈哈哈哈哈哈哈！",
      "抽中了年会特等奖：总裁体验卡（永久）。",
      "【恭喜宿主完成十万次摸鱼签到，奖励：整个集团控股权】",
      "带薪拉屎的我，拉出一座商业帝国。",
      "这栋楼太小，本座的目标是收购因果律。",
      "本座之言，便是群公告；本座之怒，便是服务器崩溃！",
      "我即天道，我即规则，我即职场本身！",
      "签到一百年，我成了职场天道。",
      "天若阻我，我便不出门；地若拦我，我便收购这地！",
      "我有一剑，可斩星辰；我有一键，可让全楼断电！",
      "被裁员那天，我绑定了职场神豪系统。"
    ];

    // 对话频率
    let lastDialogTime = 0;
    const DIALOG_MIN_INTERVAL_MS = 7500;
    const DIALOG_SHOW_MS = 3200;
    let dialogHideTimer = null;

    function showDialog(text) {
      if (dialogHideTimer) clearTimeout(dialogHideTimer);
      dialogBox.textContent = text;
      dialogBox.style.display = "block";
      dialogHideTimer = setTimeout(() => {
        dialogBox.style.display = "none";
      }, DIALOG_SHOW_MS);
    }

    function randomLine(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function updateDialog(now) {
      if (now - lastDialogTime < DIALOG_MIN_INTERVAL_MS) return;

      // 概率：早期更勤快，后期更“天道发言稀有”
      const chance = secondsSurvived < 60 ? 0.75 : (secondsSurvived < 180 ? 0.60 : 0.48);
      if (Math.random() > chance) return;

      if (secondsSurvived < 65) showDialog(randomLine(earlyLines));
      else if (secondsSurvived < 190) showDialog(randomLine(midLines));
      else showDialog(randomLine(lateLines));

      lastDialogTime = now;
    }

    // ====== 奶瓶逻辑：从左出现，从右消失，最多5个 ======
    function renderMilkBar() {
      for (let i = 0; i < milkEls.length; i++) {
        if (i < milkCount) milkEls[i].classList.add("on");
        else milkEls[i].classList.remove("on");
      }
    }

    function updateMilk(now) {
      // 出现节奏：不断工作，比较频繁
      // 每 650~1100ms 加一个（上限5）
      if (milkCount < 5 && now > milkAppearTimer) {
        milkCount++;
        milkAppearTimer = now + (650 + Math.random() * 450);
      }

      // 消失节奏：从右边开始消失（整体数量减少即可表现右消失）
      // 每 900~1500ms 减一个（下限0）
      if (milkCount > 0 && now > milkVanishTimer) {
        milkCount--;
        milkVanishTimer = now + (900 + Math.random() * 600);
      }

      renderMilkBar();
    }

    // ====== 绘制：奶牛（含隐藏邪恶表情彩蛋）======
    function drawCow(x, y, size, mood) {
      // 身体
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(x, y, size, size * 0.8, 0, 0, Math.PI * 2);
      ctx.fill();

      // 斑点
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.ellipse(x - size * 0.3, y - size * 0.2, size * 0.15, size * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + size * 0.2, y + size * 0.3, size * 0.2, size * 0.15, 0, 0, Math.PI * 2);
      ctx.fill();

      // 头部
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(x, y - size * 0.7, size * 0.7, size * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();

      const eyeY = y - size * 0.8;

      // 眼睛高度：疲惫更眯；邪恶更尖
      ctx.fillStyle = '#000000';
      const eyeW = size * 0.08;
      const eyeH =
        mood === "evil" ? size * 0.03 :
        mood === "critical" ? size * 0.026 :
        mood === "tired" ? size * 0.036 :
        size * 0.05;

      ctx.beginPath();
      ctx.ellipse(x - size * 0.3, eyeY, eyeW, eyeH, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + size * 0.3, eyeY, eyeW, eyeH, 0, 0, Math.PI * 2);
      ctx.fill();

      // 眉毛：邪恶彩蛋
      if (mood === "evil") {
        ctx.strokeStyle = 'rgba(0,0,0,0.9)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x - size * 0.55, eyeY - size * 0.12);
        ctx.lineTo(x - size * 0.15, eyeY - size * 0.03);
        ctx.moveTo(x + size * 0.55, eyeY - size * 0.12);
        ctx.lineTo(x + size * 0.15, eyeY - size * 0.03);
        ctx.stroke();
      }

      // 眼袋：疲惫/濒危
      if (mood === "tired" || mood === "critical") {
        ctx.strokeStyle = 'rgba(0,0,0,0.33)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x - size * 0.3, eyeY + size * 0.08, size * 0.08, 0, Math.PI);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x + size * 0.3, eyeY + size * 0.08, size * 0.08, 0, Math.PI);
        ctx.stroke();
      }

      // 嘴巴：happy微笑 / tired平直 / critical苦脸 / evil邪笑
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2;
      ctx.beginPath();
      if (mood === "happy") {
        ctx.arc(x, y - size * 0.62, size * 0.22, 0, Math.PI);
      } else if (mood === "critical") {
        ctx.arc(x, y - size * 0.52, size * 0.20, Math.PI, Math.PI * 2);
      } else if (mood === "tired") {
        ctx.moveTo(x - size * 0.22, y - size * 0.58);
        ctx.lineTo(x + size * 0.22, y - size * 0.58);
      } else if (mood === "evil") {
        // 邪笑：偏斜的小弧
        ctx.arc(x + size * 0.05, y - size * 0.58, size * 0.22, 0.15, Math.PI - 0.05);
      } else {
        ctx.arc(x, y - size * 0.60, size * 0.18, 0, Math.PI);
      }
      ctx.stroke();

      // 耳朵
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(x - size * 0.5, y - size * 0.9, size * 0.2, size * 0.3, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + size * 0.5, y - size * 0.9, size * 0.2, size * 0.3, 0.5, 0, Math.PI * 2);
      ctx.fill();

      // 角
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x - size * 0.2, y - size * 1.1);
      ctx.lineTo(x - size * 0.15, y - size * 1.3);
      ctx.moveTo(x + size * 0.2, y - size * 1.1);
      ctx.lineTo(x + size * 0.15, y - size * 1.3);
      ctx.stroke();
    }

    function drawHorse(x, y, size) {
      ctx.fillStyle = '#8B4513';
      ctx.beginPath();
      ctx.ellipse(x, y, size * 0.8, size * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(x, y - size * 0.6, size * 0.5, size * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#654321';
      ctx.beginPath();
      ctx.ellipse(x, y - size * 0.8, size * 0.6, size * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.ellipse(x - size * 0.2, y - size * 0.7, size * 0.06, size * 0.08, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + size * 0.2, y - size * 0.7, size * 0.06, size * 0.08, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#8B4513';
      ctx.lineWidth = size * 0.15;
      ctx.beginPath();
      ctx.moveTo(x - size * 0.3, y + size * 0.3);
      ctx.lineTo(x - size * 0.3, y + size * 0.8);
      ctx.moveTo(x + size * 0.3, y + size * 0.3);
      ctx.lineTo(x + size * 0.3, y + size * 0.8);
      ctx.stroke();
    }

    function drawBoss(x, y, size) {
      ctx.fillStyle = '#FF6B6B';
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FF0000';
      ctx.beginPath();
      ctx.ellipse(x - size * 0.4, y - size * 0.2, size * 0.15, size * 0.2, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + size * 0.4, y - size * 0.2, size * 0.15, size * 0.2, 0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#8B0000';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x - size * 0.6, y - size * 0.4);
      ctx.lineTo(x - size * 0.2, y - size * 0.3);
      ctx.moveTo(x + size * 0.6, y - size * 0.4);
      ctx.lineTo(x + size * 0.2, y - size * 0.3);
      ctx.stroke();

      ctx.strokeStyle = '#8B0000';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(x, y + size * 0.2, size * 0.3, 0, Math.PI);
      ctx.stroke();
    }

    function drawCoin(x, y, size) {
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FFA500';
      ctx.beginPath();
      ctx.arc(x, y, size * 0.7, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FFD700';
      ctx.font = `bold ${size}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('¥', x, y);
    }

    function createParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10,
          size: Math.random() * 5 + 2,
          color,
          life: 1
        });
      }
    }

    function createCoinParticles(x, y, n = 5) {
      for (let i = 0; i < n; i++) {
        coinParticles.push({
          x, y,
          vx: (Math.random() - 0.5) * 5,
          vy: -Math.random() * 5 - 2,
          size: 14,
          life: 1
        });
      }
    }

    function addFloatText(x, y, text, color = "#e0f7fa") {
      floatTexts.push({
        x, y,
        text,
        color,
        vy: -1.2,
        life: 1
      });
    }

    function updateParticles(dt) {
      particles = particles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.5;
        p.life -= 0.02 * dt * 60;
        p.size *= (1 - 0.02 * dt * 60 * 0.02);
        return p.life > 0;
      });
    }

    function updateCoinParticles(dt) {
      coinParticles = coinParticles.filter(c => {
        c.x += c.vx;
        c.y += c.vy;
        c.vy += 0.3;
        c.life -= 0.01 * dt * 60;
        return c.life > 0;
      });
    }

    function updateFloatTexts(dt) {
      floatTexts = floatTexts.filter(t => {
        t.y += t.vy * dt * 60;
        t.life -= 0.02 * dt * 60;
        return t.life > 0;
      });
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function drawCoinParticles() {
      coinParticles.forEach(c => {
        ctx.globalAlpha = c.life;
        drawCoin(c.x, c.y, c.size);
      });
      ctx.globalAlpha = 1;
    }

    function drawFloatTexts() {
      floatTexts.forEach(t => {
        ctx.globalAlpha = t.life;
        ctx.fillStyle = t.color;
        ctx.font = "bold 16px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(t.text, t.x, t.y);
      });
      ctx.globalAlpha = 1;
    }

    // ====== 敌人行为：chase / wander / flee ======
    function spawnEnemy() {
      const side = Math.floor(Math.random() * 4);
      let x, y;
      switch (side) {
        case 0: x = Math.random() * canvas.width; y = -50; break;
        case 1: x = canvas.width + 50; y = Math.random() * canvas.height; break;
        case 2: x = Math.random() * canvas.width; y = canvas.height + 50; break;
        case 3: x = -50; y = Math.random() * canvas.height; break;
      }

      const isBoss = Math.random() < 0.10;

      // 行为分布：一部分追你，一部分游荡，一部分逃离你
      const r = Math.random();
      const behavior = (r < 0.55) ? "chase" : (r < 0.80 ? "wander" : "flee");

      enemies.push({
        x, y,
        size: isBoss ? 40 : 25,
        speed: isBoss ? 1.7 : (2.0 + difficulty * 0.25),
        isBoss,
        hp: isBoss ? 3 : 1,
        behavior,
        // wander用：随机方向
        vx: (Math.random() - 0.5) * 2.2,
        vy: (Math.random() - 0.5) * 2.2,
        nextTurn: performance.now() + (400 + Math.random() * 900),
        lastHit: 0
      });
    }

    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

    // ====== 指数金币增长函数 ======
    function coinMultiplier() {
      // 每30秒明显变快
      const t = secondsSurvived;
      return Math.pow(1.06, t / 10); // 10秒×1.06 => 后期爆炸
    }

    function rewardForKill(isBoss, x, y) {
      if (isBoss) {
        hp = clamp(hp + BOSS_HEAL, 0, MAX_HP);
        score += 120;

        const gain = Math.max(1, Math.floor(BOSS_COIN_BASE * coinMultiplier()));
        coinScore += gain;

        createParticles(x, y, '#FFD700', 34);
        createCoinParticles(x, y, 10);
        addFloatText(x, y - 10, `+${BOSS_HEAL} HP`, "#92fe9d");
        addFloatText(x, y + 12, `+${gain} 金币`, "#FFD700");
      } else {
        hp = clamp(hp + SMALL_HEAL, 0, MAX_HP);
        score += 12;

        const gain = Math.max(1, Math.floor(SMALL_COIN_BASE * coinMultiplier()));
        coinScore += gain;

        createParticles(x, y, '#00FF88', 22);
        createCoinParticles(x, y, 5);
        addFloatText(x, y - 10, `+${SMALL_HEAL} HP`, "#92fe9d");
        addFloatText(x, y + 12, `+${gain} 金币`, "#FFD700");
      }

      // 开心表情 0.85s
      player.happyUntil = performance.now() + 850;
    }

    // 表情：低HP/高难度 => tired/critical；击杀短暂 happy；偶尔 evil 彩蛋
    function updateMood(now) {
      // 邪恶彩蛋：很低概率触发 0.7s
      if (now > player.evilUntil && Math.random() < 0.0022) {
        player.evilUntil = now + 700;
      }

      if (now < player.evilUntil) {
        player.mood = "evil";
        return;
      }

      if (now < player.happyUntil) {
        player.mood = "happy";
        return;
      }

      const hpRatio = hp / MAX_HP;
      if (hp <= 16) player.mood = "critical";
      else if (hpRatio < 0.42 || difficulty >= 7) player.mood = "tired";
      else player.mood = "calm";
    }

    // ====== 刷怪密度：更多 + 波动不稳定（时多时少）======
    // 用“波形 + 随机抖动 + 难度”控制生成概率
    function spawnChance(now) {
      const t = now / 1000; // 秒
      // 基础密度更高
      const base = 0.030 + Math.min(0.050, difficulty * 0.0045);

      // 波动：正弦+随机噪声，让它时多时少
      const wave = 0.020 * (Math.sin(t * 0.9) * 0.5 + 0.5) + 0.018 * (Math.sin(t * 0.23 + 2.1) * 0.5 + 0.5);
      const jitter = (Math.random() - 0.5) * 0.020;

      // clamp
      return clamp(base + wave + jitter, 0.012, 0.16);
    }

    // ====== 更新 ======
    function update(now, dt) {
      if (!gameRunning) return;

      // 1) 寿命指数减少：开始慢，后面越来越快
      const minutes = secondsSurvived / 60;
      const decayRate = DAYS_DECAY_BASE_PER_SEC * Math.pow(DAYS_DECAY_GROWTH_PER_MIN, minutes); // 天/秒
      daysLeft -= decayRate * dt;
      if (daysLeft < 0) daysLeft = 0;

      // 2) 计时
      secondsSurvived += dt;

      // 3) 玩家移动
      const dx = player.targetX - player.x;
      const dy = player.targetY - player.y;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance > 5) {
        player.x += (dx / distance) * player.speed * dt * 60;
        player.y += (dy / distance) * player.speed * dt * 60;
      }

      // 4) 敌人行为移动
      enemies.forEach((enemy, index) => {
        const px = player.x, py = player.y;
        const ex = enemy.x, ey = enemy.y;
        const ddx = px - ex;
        const ddy = py - ey;
        const dist = Math.sqrt(ddx * ddx + ddy * ddy) || 0.0001;

        if (enemy.behavior === "chase") {
          enemy.x += (ddx / dist) * enemy.speed * dt * 60;
          enemy.y += (ddy / dist) * enemy.speed * dt * 60;
        } else if (enemy.behavior === "flee") {
          enemy.x -= (ddx / dist) * enemy.speed * dt * 60;
          enemy.y -= (ddy / dist) * enemy.speed * dt * 60;
        } else {
          // wander：定期换方向
          if (now > enemy.nextTurn) {
            enemy.vx = (Math.random() - 0.5) * 3.2;
            enemy.vy = (Math.random() - 0.5) * 3.2;
            enemy.nextTurn = now + (450 + Math.random() * 1050);
          }
          enemy.x += enemy.vx * dt * 60;
          enemy.y += enemy.vy * dt * 60;

          // 边界反弹
          if (enemy.x < -40 || enemy.x > canvas.width + 40) enemy.vx *= -1;
          if (enemy.y < -40 || enemy.y > canvas.height + 40) enemy.vy *= -1;
        }

        // 5) 碰撞：扣血更少 + 冷却，避免瞬间暴毙
        const cx = player.x - enemy.x;
        const cy = player.y - enemy.y;
        const cdist = Math.sqrt(cx * cx + cy * cy);

        if (cdist < player.size + enemy.size) {
          if (now - enemy.lastHit > HIT_COOLDOWN_MS) {
            enemy.lastHit = now;
            hp -= enemy.isBoss ? BOSS_DAMAGE : SMALL_DAMAGE;
            hp = clamp(hp, 0, MAX_HP);
          }

          // 击杀逻辑：boss需要碰3次，普通碰1次就算“打败”
          if (enemy.isBoss) {
            enemy.hp--;
            if (enemy.hp <= 0) {
              rewardForKill(true, enemy.x, enemy.y);
              enemies.splice(index, 1);
            }
          } else {
            rewardForKill(false, enemy.x, enemy.y);
            enemies.splice(index, 1);
          }
        }
      });

      // 6) 难度：跟得分走（略慢一点）
      difficulty = Math.floor(score / 140) + 1;

      // 7) 刷怪：更多 + 波动
      const p = spawnChance(now);
      // 单帧可能刷多个（波动更明显）
      if (Math.random() < p) spawnEnemy();
      if (Math.random() < p * 0.35) spawnEnemy(); // 偶尔双刷

      // 8) 视觉更新
      updateParticles(dt);
      updateCoinParticles(dt);
      updateFloatTexts(dt);

      // 9) 台词 + 奶瓶 + 表情
      updateDialog(now);
      updateMilk(now);
      updateMood(now);

      // 10) UI
      document.getElementById('daysLeft').textContent = Math.max(0, Math.floor(daysLeft));
      document.getElementById('hp').textContent = Math.floor(hp);
      document.getElementById('difficulty').textContent = difficulty;
      document.getElementById('coinScore').textContent = coinScore;

      // 11) 结束：寿命归零或HP归零
      if (daysLeft <= 0 || hp <= 0) gameOver();
    }

    // ====== 绘制 ======
    function draw() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 流汗：疲惫/濒危时更明显
      if ((player.mood === "tired" || player.mood === "critical") && Math.random() < 0.32) {
        ctx.fillStyle = '#87CEEB';
        ctx.beginPath();
        ctx.arc(player.x - player.size * 0.85, player.y - player.size * 0.5, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      // 玩家
      drawCow(player.x, player.y, player.size, player.mood);

      // 敌人
      enemies.forEach(enemy => {
        if (enemy.isBoss) drawBoss(enemy.x, enemy.y, enemy.size);
        else drawHorse(enemy.x, enemy.y, enemy.size);
      });

      drawParticles();
      drawCoinParticles();
      drawFloatTexts();
    }

    // ====== 主循环 ======
    function gameLoop(now) {
      const dt = Math.min(0.033, Math.max(0.008, (now - lastFrameTime) / 1000));
      lastFrameTime = now;

      update(now, dt);
      draw();
      requestAnimationFrame(gameLoop);
    }

    // ====== 结束/重开 ======
    function gameOver() {
      gameRunning = false;
      document.getElementById('finalScore').textContent = score;
      document.getElementById('finalCoins').textContent = coinScore;
      document.getElementById('finalSeconds').textContent = Math.floor(secondsSurvived);
      gameOverPanel.style.display = 'block';
    }

    function restart() {
      player.x = canvas.width / 2;
      player.y = canvas.height / 2;
      player.targetX = canvas.width / 2;
      player.targetY = canvas.height / 2;
      player.mood = "calm";
      player.happyUntil = 0;
      player.evilUntil = 0;

      enemies = [];
      particles = [];
      coinParticles = [];
      floatTexts = [];

      daysLeft = INITIAL_DAYS;
      hp = MAX_HP;
      score = 0;
      coinScore = 0;
      difficulty = 1;

      secondsSurvived = 0;
      lastFrameTime = performance.now();

      lastDialogTime = 0;
      dialogBox.style.display = "none";
      if (dialogHideTimer) {
        clearTimeout(dialogHideTimer);
        dialogHideTimer = null;
      }

      // 奶瓶重置
      milkCount = 0;
      milkAppearTimer = 0;
      milkVanishTimer = 0;
      renderMilkBar();

      gameRunning = true;
      gameOverPanel.style.display = 'none';
    }

    // ====== 控制 ======
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      player.targetX = e.clientX - rect.left;
      player.targetY = e.clientY - rect.top;
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      player.targetX = touch.clientX - rect.left;
      player.targetY = touch.clientY - rect.top;
    }, { passive: false });

    restartBtn.addEventListener('click', restart);

    // ====== 开始 ======
    renderMilkBar();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
