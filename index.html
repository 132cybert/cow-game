<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>职场模拟器：从实习生到诸天万界总裁</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial;
overflow:hidden;
}
#gameInfo{
position:absolute;
top:20px;
width:90%;
max-width:900px;
display:flex;
justify-content:space-between;
background:rgba(255,255,255,0.15);
padding:14px 20px;
border-radius:18px;
backdrop-filter:blur(10px);
color:#e0f7fa;
font-weight:bold;
}
canvas{
border-radius:15px;
background:rgba(255,255,255,0.05);
box-shadow:0 15px 35px rgba(0,0,0,0.5);
}
#dialogBox{
position:absolute;
bottom:40px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.75);
color:#e0f7fa;
padding:14px 20px;
border-radius:20px;
display:none;
max-width:80%;
text-align:center;
}
</style>
</head>
<body>

<div id="gameInfo">
<div>剩余寿命: <span id="daysLeft">21346</span></div>
<div>HP: <span id="hp">100</span></div>
<div>难度: <span id="difficulty">1</span></div>
<div>金币: <span id="coinScore">0</span></div>
</div>

<canvas id="gameCanvas" width="800" height="600"></canvas>
<div id="dialogBox"></div>

<script>
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");
const dialogBox=document.getElementById("dialogBox");

let daysLeft=21346;
let hp=100;
let score=0;
let coinScore=0;
let difficulty=1;
let secondsSurvived=0;
let lastTick=performance.now();

let player={
x:400,y:300,size:30,
targetX:400,targetY:300,
speed:4,
mood:"calm"
};

let enemies=[];
let milkBottles=[];

const SMALL_DAMAGE=3;     // 更简单
const BOSS_DAMAGE=8;

function coinReward(d){
return Math.floor(Math.pow(1.12,d));
}

function daysDecay(sec){
return Math.min(0.15*Math.pow(1.015,sec),40);
}

/* ================= 奶瓶传送带 ================= */

function spawnMilk(){
milkBottles.push({
x:canvas.width+20,
y:canvas.height-40,
size:16
});
}

function updateMilk(){
milkBottles.forEach(m=>m.x-=1.5);
milkBottles=milkBottles.filter(m=>m.x>-20);
}

function drawMilk(){
milkBottles.forEach(m=>{
ctx.fillStyle="#ffffff";
ctx.fillRect(m.x-6,m.y-12,12,24);
ctx.fillStyle="#87CEFA";
ctx.fillRect(m.x-4,m.y-10,8,14);
});
}

/* ================= 台词 ================= */

const earlyLines=[
"第一天上班……",
"为什么空气这么压抑？",
"我是不是选错专业了？",
"再坚持一下……也许明年会涨薪。",
"今天又要加班吗？",
"困死了，乌乌。",
"好想回家。",
"只有我不会吗？",
"大家都会，我也学学吧。",
"好累……但不敢停。",
"先活下来再说。",
"我开始收集变量。",
"我今天帮刘姐做了她的活！嘿嘿。",
"今天不加班，好开心。",
"怎么又改需求？",
"我只是个实习生啊……",
"同事会拍马屁，升职好快。",
"会议像黑洞：吞噬时间，吐出KPI。"
];

const midLines=[
"原来权力，是结构。",
"想回家。",
"我燃尽了……",
"马年快乐",
"为什么抢我的功劳？",
"原来不是我不行，是游戏有问题。",
"我不再焦虑，我开始计算。",
"资源流向强者。",
"八嘎呀路！",
"小猫咪！嘬嘬嘬",
"实习生！嘬嘬嘬",
"王总，这个方案这样做更好。",
"我开始收集变量。",
"呵呵。",
"耐心，是我的武器。",
"当我不再解释，我就开始赢。"
];

const lateLines=[
"五年前，我在底层挨耳光；五年后，总经理为我擦皮鞋——这一巴掌，利息十亿。",
"哈哈哈哈哈哈哈哈哈哈哈哈！",
"抽中了年会特等奖：总裁体验卡（永久）。",
"【恭喜宿主完成十万次摸鱼签到，奖励：整个集团控股权】",
"带薪拉屎的我，拉出一座商业帝国。",
"这栋楼太小，本座的目标是收购因果律。",
"本座之言，便是群公告；本座之怒，便是服务器崩溃！",
"我即天道，我即规则，我即职场本身！",
"签到一百年，我成了职场天道。",
"天若阻我，我便不出门；地若拦我，我便收购这地！",
"我有一剑，可斩星辰；我有一键，可让全楼断电！",
"被裁员那天，我绑定了职场神豪系统。"
];

let lastDialog=0;

function showLine(){
if(performance.now()-lastDialog<7000)return;
let line;
if(secondsSurvived<60) line=earlyLines[Math.floor(Math.random()*earlyLines.length)];
else if(secondsSurvived<180) line=midLines[Math.floor(Math.random()*midLines.length)];
else line=lateLines[Math.floor(Math.random()*lateLines.length)];
dialogBox.innerText=line;
dialogBox.style.display="block";
setTimeout(()=>dialogBox.style.display="none",3000);
lastDialog=performance.now();
}

/* ================= 敌人 ================= */

function spawnEnemy(){
let type=Math.random();
enemies.push({
x:Math.random()*800,
y:-40,
size:25,
speed:2+Math.random(),
behavior:type<0.5?"seek":type<0.75?"wander":"avoid"
});
}

function updateEnemies(){
enemies.forEach(e=>{
if(e.behavior==="seek"){
let dx=player.x-e.x;
let dy=player.y-e.y;
let d=Math.sqrt(dx*dx+dy*dy)||1;
e.x+=dx/d*e.speed;
e.y+=dy/d*e.speed;
}
if(e.behavior==="wander"){
e.x+=(Math.random()-0.5)*2;
e.y+=e.speed;
}
if(e.behavior==="avoid"){
let dx=e.x-player.x;
let dy=e.y-player.y;
let d=Math.sqrt(dx*dx+dy*dy)||1;
e.x+=dx/d*e.speed;
e.y+=dy/d*e.speed;
}
if(Math.hypot(player.x-e.x,player.y-e.y)<player.size+e.size){
hp-=SMALL_DAMAGE;
}
});
}

/* ================= 玩家 ================= */

function drawPlayer(){
ctx.fillStyle="#fff";
ctx.beginPath();
ctx.arc(player.x,player.y,player.size,0,Math.PI*2);
ctx.fill();
ctx.fillStyle="#000";
ctx.beginPath();
ctx.arc(player.x-8,player.y-8,3,0,Math.PI*2);
ctx.arc(player.x+8,player.y-8,3,0,Math.PI*2);
ctx.fill();
ctx.beginPath();
ctx.arc(player.x,player.y+4,6,0,Math.PI);
ctx.stroke();
}

/* ================= 主循环 ================= */

function update(){
let now=performance.now();
if(now-lastTick>1000){
secondsSurvived++;
daysLeft-=daysDecay(secondsSurvived);
lastTick=now;
}
difficulty=Math.floor(score/100)+1;
updateEnemies();
updateMilk();
if(Math.random()<0.7)spawnMilk();
if(Math.random()<0.03*difficulty)spawnEnemy();
showLine();
document.getElementById("daysLeft").innerText=Math.floor(daysLeft);
document.getElementById("hp").innerText=hp;
document.getElementById("difficulty").innerText=difficulty;
document.getElementById("coinScore").innerText=coinScore;
if(daysLeft<=0||hp<=0)location.reload();
}

function draw(){
ctx.fillStyle="rgba(0,0,0,0.2)";
ctx.fillRect(0,0,800,600);
drawMilk();
drawPlayer();
enemies.forEach(e=>{
ctx.fillStyle="#8B4513";
ctx.beginPath();
ctx.arc(e.x,e.y,e.size,0,Math.PI*2);
ctx.fill();
});
}

function loop(){
update();
draw();
requestAnimationFrame(loop);
}

canvas.addEventListener("mousemove",e=>{
let rect=canvas.getBoundingClientRect();
player.targetX=e.clientX-rect.left;
player.targetY=e.clientY-rect.top;
player.x=player.targetX;
player.y=player.targetY;
});

loop();
</script>
</body>
</html>
