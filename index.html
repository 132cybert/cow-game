<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>职场模拟器：从实习生到诸天万界总裁</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
display:flex;justify-content:center;align-items:center;
min-height:100vh;overflow:hidden;font-family:Arial;
}

#gameInfo{
position:absolute;top:15px;width:90%;
display:flex;justify-content:space-between;
background:rgba(255,255,255,.15);
padding:10px 20px;border-radius:15px;
color:#e0f7fa;font-weight:bold;
backdrop-filter:blur(10px);
}

#dialogBox{
position:absolute;bottom:30px;
left:50%;transform:translateX(-50%);
background:rgba(0,0,0,.7);
color:#e0f7fa;padding:12px 20px;
border-radius:20px;display:none;
max-width:70%;text-align:center;
}

canvas{
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.5);
background:rgba(255,255,255,.05);
}
</style>
</head>

<body>

<div id="gameInfo">
<div>剩余寿命: <span id="daysLeft">21346</span></div>
<div>HP: <span id="hp">100</span></div>
<div>难度: <span id="difficulty">1</span></div>
<div>金币: <span id="coins">0</span></div>
</div>

<canvas id="gameCanvas" width="800" height="600"></canvas>
<div id="dialogBox"></div>

<script>

const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

let daysLeft=21346;
let hp=100;
let difficulty=1;
let coins=0;
let score=0;
let seconds=0;

let player={
x:400,y:300,size:30,
targetX:400,targetY:300,
mood:"calm",
blink:0
};

let enemies=[];
let milkLine=[]; // 右下角流水线奶瓶

/* ======== 休闲难度调整 ======== */

// 扣血更少
const SMALL_DAMAGE=4;
const BOSS_DAMAGE=10;

// 击杀回血更多
const SMALL_HEAL=15;
const BOSS_HEAL=35;

/* ======== 台词 ======== */

const earlyLines=[
"第一天上班……",
"为什么空气这么压抑？",
"我是不是选错专业了？",
"再坚持一下……也许明年会涨薪。",
"今天又要加班吗？",
"困死了，乌乌。",
"好想回家。",
"只有我不会吗？",
"大家都会，我也学学吧。",
"好累……但不敢停。",
"先活下来再说。",
"我开始收集变量。",
"我今天帮刘姐做了她的活！嘿嘿。",
"今天不加班，好开心。",
"怎么又改需求？",
"我只是个实习生啊……",
"同事会拍马屁，升职好快。",
"会议像黑洞：吞噬时间，吐出KPI。"
];

const midLines=[
"原来权力，是结构。",
"想回家。",
"我燃尽了……",
"马年快乐",
"为什么抢我的功劳？",
"原来不是我不行，是游戏有问题。",
"我不再焦虑，我开始计算。",
"资源流向强者。",
"八嘎呀路！",
"小猫咪！嘬嘬嘬",
"实习生！嘬嘬嘬",
"王总，这个方案这样做更好。",
"我开始收集变量。",
"呵呵。",
"耐心，是我的武器。",
"当我不再解释，我就开始赢。"
];

const lateLines=[
"五年前，我在底层挨耳光；五年后，总经理为我擦皮鞋——这一巴掌，利息十亿。",
"哈哈哈哈哈哈哈哈哈哈哈哈！",
"抽中了年会特等奖：总裁体验卡（永久）。",
"【恭喜宿主完成十万次摸鱼签到，奖励：整个集团控股权】",
"带薪拉屎的我，拉出一座商业帝国。",
"这栋楼太小，本座的目标是收购因果律。",
"本座之言，便是群公告；本座之怒，便是服务器崩溃！",
"我即天道，我即规则，我即职场本身！",
"签到一百年，我成了职场天道。",
"天若阻我，我便不出门；地若拦我，我便收购这地！",
"我有一剑，可斩星辰；我有一键，可让全楼断电！",
"被裁员那天，我绑定了职场神豪系统。"
];

let lastDialog=0;

function showDialog(text){
const box=document.getElementById("dialogBox");
box.innerText=text;
box.style.display="block";
setTimeout(()=>box.style.display="none",3000);
}

function randomLine(arr){return arr[Math.floor(Math.random()*arr.length)];}

function dialogUpdate(){
if(Date.now()-lastDialog<8000)return;
if(Math.random()<0.4){
if(seconds<60)showDialog(randomLine(earlyLines));
else if(seconds<180)showDialog(randomLine(midLines));
else showDialog(randomLine(lateLines));
lastDialog=Date.now();
}
}

/* ======== 奶瓶流水线 ======== */

function updateMilkLine(){
if(Math.random()<0.6){
milkLine.push({life:1});
}
milkLine=milkLine.filter(m=>{
m.life-=0.01;
return m.life>0;
});
}

function drawMilkLine(){
const startX=canvas.width-260;
const startY=canvas.height-60;

milkLine.forEach((m,i)=>{
const x=startX+i*18;
const y=startY;
ctx.globalAlpha=m.life;
ctx.fillStyle="#fff";
ctx.fillRect(x,y,10,25);
ctx.fillStyle="#87CEFA";
ctx.fillRect(x,y-6,10,6);
});
ctx.globalAlpha=1;
}

/* ======== 敌人 ======== */

function spawnEnemy(){
const side=Math.floor(Math.random()*4);
let x,y;
if(side===0){x=Math.random()*800;y=-40;}
if(side===1){x=840;y=Math.random()*600;}
if(side===2){x=Math.random()*800;y=640;}
if(side===3){x=-40;y=Math.random()*600;}

const type=Math.random();
let behavior="seek";
if(type<0.5)behavior="seek";
else if(type<0.8)behavior="wander";
else behavior="avoid";

enemies.push({
x,y,
size:25,
behavior,
vx:(Math.random()-.5)*2,
vy:(Math.random()-.5)*2
});
}

function updateEnemies(){
enemies.forEach(e=>{
if(e.behavior==="seek"){
let dx=player.x-e.x;
let dy=player.y-e.y;
let d=Math.sqrt(dx*dx+dy*dy)||1;
e.x+=dx/d*2;
e.y+=dy/d*2;
}
if(e.behavior==="wander"){
e.x+=e.vx;
e.y+=e.vy;
}
if(e.behavior==="avoid"){
let dx=e.x-player.x;
let dy=e.y-player.y;
let d=Math.sqrt(dx*dx+dy*dy)||1;
e.x+=dx/d*2;
e.y+=dy/d*2;
}
});
}

/* ======== 游戏更新 ======== */

function update(){

// 寿命指数减少（慢一点）
daysLeft-=0.15*Math.pow(1.01,seconds);
seconds+=0.016;

// 玩家移动
let dx=player.targetX-player.x;
let dy=player.targetY-player.y;
let d=Math.sqrt(dx*dx+dy*dy);
if(d>1){
player.x+=dx/d*3;
player.y+=dy/d*3;
}

// 敌人
if(Math.random()<0.02*difficulty)spawnEnemy();
updateEnemies();

// 碰撞
enemies=enemies.filter(e=>{
let dx=player.x-e.x;
let dy=player.y-e.y;
let dist=Math.sqrt(dx*dx+dy*dy);
if(dist<player.size+e.size){
hp-=SMALL_DAMAGE;
return false;
}
return true;
});

// 难度缓慢提升
difficulty=1+Math.floor(seconds/60);

// 奶瓶
updateMilkLine();

// 台词
dialogUpdate();

// UI
document.getElementById("daysLeft").innerText=Math.floor(daysLeft);
document.getElementById("hp").innerText=Math.floor(hp);
document.getElementById("difficulty").innerText=difficulty;
document.getElementById("coins").innerText=coins;
}

/* ======== 绘制 ======== */

function draw(){

ctx.fillStyle="rgba(0,0,0,0.2)";
ctx.fillRect(0,0,800,600);

// 小牛
ctx.fillStyle="#fff";
ctx.beginPath();
ctx.arc(player.x,player.y,30,0,Math.PI*2);
ctx.fill();

// 表情
ctx.fillStyle="#000";
ctx.beginPath();
ctx.arc(player.x-10,player.y-10,4,0,Math.PI*2);
ctx.arc(player.x+10,player.y-10,4,0,Math.PI*2);
ctx.fill();
ctx.beginPath();
ctx.arc(player.x,player.y+5,10,0,Math.PI);
ctx.stroke();

// 敌人
ctx.fillStyle="#8B4513";
enemies.forEach(e=>{
ctx.beginPath();
ctx.arc(e.x,e.y,e.size,0,Math.PI*2);
ctx.fill();
});

// 奶瓶流水线
drawMilkLine();
}

function loop(){
update();
draw();
requestAnimationFrame(loop);
}

canvas.addEventListener("mousemove",e=>{
const rect=canvas.getBoundingClientRect();
player.targetX=e.clientX-rect.left;
player.targetY=e.clientY-rect.top;
});

loop();
</script>
</body>
</html>
