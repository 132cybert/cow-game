<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>职场模拟器：从实习生到诸天万界总裁</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #gameInfo {
      position: absolute;
      top: 20px;
      width: 92%;
      max-width: 920px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      background: rgba(255, 255, 255, 0.15);
      padding: 14px 22px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #e0f7fa;
      font-size: 16px;
      font-weight: bold;
      z-index: 10;
      flex-wrap: wrap;
    }

    #gameCanvas {
      border: 2px solid rgba(173, 216, 230, 0.5);
      border-radius: 15px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      background: rgba(255, 255, 255, 0.05);
      touch-action: none;
    }

    /* 对话框 */
    #dialogBox {
      position: absolute;
      bottom: 62px; /* 给右下角奶瓶留空间 */
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #e0f7fa;
      padding: 14px 22px;
      border-radius: 20px;
      font-size: 16px;
      max-width: min(920px, 78%);
      text-align: center;
      display: none;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 20px rgba(0, 200, 255, 0.35);
      border: 1px solid rgba(255,255,255,0.16);
      line-height: 1.45;
      z-index: 50;
    }

    /* 右下角奶瓶架 */
    #bottleRack {
      position: absolute;
      right: 18px;
      bottom: 18px;
      display: flex;
      gap: 10px;
      z-index: 30;
      pointer-events: none;
    }

    .bottleSlot {
      width: 36px;
      height: 46px;
      border-radius: 10px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(0,0,0,0.22);
      opacity: 0.35;
      transition: opacity 240ms ease, transform 240ms ease;
    }

    .bottleSlot.active {
      opacity: 1;
      transform: translateY(-2px);
    }

    .bottleIcon {
      width: 16px;
      height: 28px;
      border-radius: 8px 8px 10px 10px;
      border: 1px solid rgba(255,255,255,0.35);
      position: relative;
      background: rgba(224,247,250,0.25);
      box-shadow: 0 0 16px rgba(0,200,255,0.18);
    }

    .bottleIcon::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 8px;
      border-radius: 6px 6px 4px 4px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(224,247,250,0.15);
    }

    .bottleFill {
      position: absolute;
      bottom: 2px;
      left: 2px;
      right: 2px;
      border-radius: 6px 6px 8px 8px;
      background: rgba(146,254,157,0.28);
      height: 60%;
      box-shadow: 0 0 12px rgba(146,254,157,0.18);
    }

    #gameOverPanel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(30, 30, 50, 0.9);
      padding: 40px;
      border-radius: 25px;
      text-align: center;
      display: none;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      z-index: 100;
      min-width: 360px;
    }

    #gameOverPanel h2 {
      color: #e0f7fa;
      font-size: 28px;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(0, 200, 255, 0.7);
      line-height: 1.25;
    }

    #gameOverPanel .subtitle {
      color: rgba(224, 247, 250, 0.8);
      font-size: 14px;
      margin-bottom: 18px;
      letter-spacing: 0.2px;
    }

    #gameOverPanel p {
      color: #bbdefb;
      font-size: 18px;
      margin: 10px 0;
    }

    #restartBtn {
      margin-top: 22px;
      padding: 14px 38px;
      font-size: 16px;
      background: linear-gradient(45deg, #00c9ff, #92fe9d);
      color: #0a1929;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.25s;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(0, 201, 255, 0.4);
    }

    #restartBtn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(0, 201, 255, 0.6);
    }
  </style>
</head>

<body>
  <div id="gameInfo">
    <div>剩余寿命: <span id="daysLeft">21346</span> 天</div>
    <div>生命值(HP): <span id="hp">100</span></div>
    <div>难度: <span id="difficulty">1</span></div>
    <div>金币: <span id="coinScore">0</span></div>
  </div>

  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <div id="dialogBox"></div>

  <!-- 奶瓶架：右下角，最多5个 -->
  <div id="bottleRack" aria-hidden="true">
    <div class="bottleSlot" id="slot0"><div class="bottleIcon"><div class="bottleFill"></div></div></div>
    <div class="bottleSlot" id="slot1"><div class="bottleIcon"><div class="bottleFill"></div></div></div>
    <div class="bottleSlot" id="slot2"><div class="bottleIcon"><div class="bottleFill"></div></div></div>
    <div class="bottleSlot" id="slot3"><div class="bottleIcon"><div class="bottleFill"></div></div></div>
    <div class="bottleSlot" id="slot4"><div class="bottleIcon"><div class="bottleFill"></div></div></div>
  </div>

  <div id="gameOverPanel">
    <h2>职场模拟器：本轮历练结束</h2>
    <div class="subtitle">Corporate Ascension Simulator — From Intern to Multiverse CEO</div>
    <p>最终得分: <span id="finalScore">0</span></p>
    <p>金币: <span id="finalCoins">0</span></p>
    <p>存活时长: <span id="finalSeconds">0</span> 秒</p>
    <button id="restartBtn">重新开始</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameOverPanel = document.getElementById('gameOverPanel');
    const restartBtn = document.getElementById('restartBtn');
    const dialogBox = document.getElementById('dialogBox');

    // ====== 基础资源 ======
    const INITIAL_DAYS = 21346;
    const MAX_HP = 120; // 让休闲更耐打一点（原100）
    // 扣血更少（更简单）
    const SMALL_DAMAGE = 3;
    const BOSS_DAMAGE  = 8;

    // 击杀回血更强一点（休闲爽感）
    const SMALL_HEAL = 10;
    const BOSS_HEAL  = 28;

    // 初始寿命减少（很慢），随后指数变快（时光飞逝）
    const BASE_DAYS_DECAY_PER_SEC = 0.18; // 早期很慢
    const DECAY_GROWTH_K = 180;           // 越小越快变猛（秒）
    const DECAY_MAX_CAP = 35;             // 每秒最多扣多少天（上限防爆炸到不可玩）

    // 金币指数增长：增幅随时间/难度攀升
    const COIN_BASE_SMALL = 1;
    const COIN_BASE_BOSS  = 5;
    const COIN_EXP_K = 120;   // 越小增长越疯狂
    const COIN_CAP_MULT = 500; // 防爆上限（仍很离谱）

    // 刷怪：更密、更波动
    const ENEMY_TARGET_MIN = 8;
    const ENEMY_TARGET_MAX = 26;

    // 敌人行为模式：追击/游走/远离
    const MODE_CHASE = "chase";
    const MODE_WANDER = "wander";
    const MODE_FLEE = "flee";

    let player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      size: 30,
      speed: 5.2,
      targetX: canvas.width / 2,
      targetY: canvas.height / 2,
      mood: "calm",
      happyUntil: 0,
      evilUntil: 0
    };

    let enemies = [];
    let particles = [];
    let coinsVisual = [];
    let floatTexts = [];

    let daysLeft = INITIAL_DAYS;
    let hp = MAX_HP;
    let score = 0;
    let coinScore = 0;
    let difficulty = 1;
    let gameRunning = true;

    let lastSecondTick = performance.now();
    let secondsSurvived = 0;

    // ====== 台词（你给的新版本）======
    const earlyLines = [
      "第一天上班……",
      "为什么空气这么压抑？",
      "我是不是选错专业了？",
      "再坚持一下……也许明年会涨薪。",
      "今天又要加班吗？",
      "困死了，乌乌。",
      "好想回家。",
      "只有我不会吗？",
      "大家都会，我也学学吧。",
      "好累……但不敢停。",
      "先活下来再说。",
      "哞——",
      "我今天帮刘姐做了她的活！嘿嘿。",
      "今天不加班，好开心。",
      "怎么又改需求？",
      "我只是个实习生啊……",
      "同事会拍马屁，升职好快。",
      "会议像黑洞：吞噬时间，吐出KPI。"
    ];

    const midLines = [
      "原来权力，是结构。",
      "想回家。",
      "我燃尽了……",
      "马年快乐",
      "为什么抢我的功劳？",
      "原来不是我不行，是游戏有问题。",
      "我不再焦虑，我开始计算。",
      "资源流向强者。",
      "八嘎呀路！",
      "小猫咪！嘬嘬嘬",
      "实习生！嘬嘬嘬",
      "王总，这个方案这样做更好。",
      "我开始收集变量。",
      "呵呵。",
      "耐心，是我的武器。",
      "当我不再解释，我就开始赢。"
    ];

    const lateLines = [
      "五年前，我在底层挨耳光；五年后，总经理为我擦皮鞋——这一巴掌，利息十亿。",
      "哈哈哈哈哈哈哈哈哈哈哈哈！",
      "抽中了年会特等奖：总裁体验卡（永久）。",
      "【恭喜宿主完成十万次摸鱼签到，奖励：整个集团控股权】",
      "带薪拉屎的我，拉出一座商业帝国。",
      "这栋楼太小，本座的目标是收购因果律。",
      "本座之言，便是群公告；本座之怒，便是服务器崩溃！",
      "我即天道，我即规则，我即职场本身！",
      "签到一百年，我成了职场天道。",
      "天若阻我，我便不出门；地若拦我，我便收购这地！",
      "我有一剑，可斩星辰；我有一键，可让全楼断电！",
      "被裁员那天，我绑定了职场神豪系统。"
    ];

    let lastDialogTime = 0;
    const DIALOG_MIN_INTERVAL_MS = 7000;
    const DIALOG_SHOW_MS = 3200;
    let dialogHideTimer = null;

    function showDialog(text) {
      if (dialogHideTimer) clearTimeout(dialogHideTimer);
      dialogBox.textContent = text;
      dialogBox.style.display = "block";
      dialogHideTimer = setTimeout(() => {
        dialogBox.style.display = "none";
      }, DIALOG_SHOW_MS);
    }

    function randomLine(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function updateDialog() {
      const now = performance.now();
      if (now - lastDialogTime < DIALOG_MIN_INTERVAL_MS) return;

      const chance = secondsSurvived < 60 ? 0.78 : (secondsSurvived < 180 ? 0.62 : 0.48);
      if (Math.random() > chance) return;

      if (secondsSurvived < 60) showDialog(randomLine(earlyLines));
      else if (secondsSurvived < 180) showDialog(randomLine(midLines));
      else showDialog(randomLine(lateLines));

      lastDialogTime = now;
    }

    // ====== 奶瓶系统：最多5个，右->左出现，左->右消失 ======
    const bottleSlots = [
      document.getElementById("slot0"),
      document.getElementById("slot1"),
      document.getElementById("slot2"),
      document.getElementById("slot3"),
      document.getElementById("slot4"),
    ];

    let bottles = [0,0,0,0,0]; // 0 empty / 1 active
    let bottleSpawnTimer = 0;
    let bottleDespawnTimer = 0;

    function renderBottles() {
      for (let i = 0; i < 5; i++) {
        if (bottles[i] === 1) bottleSlots[i].classList.add("active");
        else bottleSlots[i].classList.remove("active");
      }
    }

    // 右边第一个开始出现：索引 4,3,2,1,0
    function spawnBottleFromRight() {
      for (let i = 4; i >= 0; i--) {
        if (bottles[i] === 0) {
          bottles[i] = 1;
          return true;
        }
      }
      return false;
    }

    // 从左边第一个开始消失：索引 0,1,2,3,4
    function despawnBottleFromLeft() {
      for (let i = 0; i < 5; i++) {
        if (bottles[i] === 1) {
          bottles[i] = 0;
          return true;
        }
      }
      return false;
    }

    // ====== 绘制：奶牛（表情：calm/tired/critical/happy + 彩蛋evil）======
    function drawCow(x, y, size, mood) {
      // 身体
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(x, y, size, size * 0.8, 0, 0, Math.PI * 2);
      ctx.fill();

      // 斑点
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.ellipse(x - size * 0.3, y - size * 0.2, size * 0.15, size * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + size * 0.2, y + size * 0.3, size * 0.2, size * 0.15, 0, 0, Math.PI * 2);
      ctx.fill();

      // 头部
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(x, y - size * 0.7, size * 0.7, size * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();

      // 眼睛形态
      const eyeW = size * 0.08;
      let eyeH =
        mood === "critical" ? size * 0.022 :
        mood === "tired" ? size * 0.032 :
        size * 0.05;

      // 邪恶彩蛋：更尖更坏
      const evil = (performance.now() < player.evilUntil);
      if (evil) eyeH = size * 0.06;

      const eyeY = y - size * 0.8;

      // 眼睛颜色（邪恶时微红）
      ctx.fillStyle = evil ? "rgba(255,80,80,0.95)" : "#000000";
      ctx.beginPath();
      ctx.ellipse(x - size * 0.3, eyeY, eyeW, eyeH, evil ? -0.45 : 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + size * 0.3, eyeY, eyeW, eyeH, evil ? 0.45 : 0, 0, Math.PI * 2);
      ctx.fill();

      // 眉毛（邪恶时）
      if (evil) {
        ctx.strokeStyle = "rgba(0,0,0,0.9)";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(x - size * 0.52, eyeY - size * 0.18);
        ctx.lineTo(x - size * 0.18, eyeY - size * 0.05);
        ctx.moveTo(x + size * 0.52, eyeY - size * 0.18);
        ctx.lineTo(x + size * 0.18, eyeY - size * 0.05);
        ctx.stroke();
      }

      // 眼袋
      if (mood === "tired" || mood === "critical") {
        ctx.strokeStyle = 'rgba(0,0,0,0.32)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x - size * 0.3, eyeY + size * 0.08, size * 0.08, 0, Math.PI);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x + size * 0.3, eyeY + size * 0.08, size * 0.08, 0, Math.PI);
        ctx.stroke();
      }

      // 嘴巴
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      if (evil) {
        // 坏笑
        ctx.moveTo(x - size * 0.2, y - size * 0.6);
        ctx.quadraticCurveTo(x, y - size * 0.48, x + size * 0.26, y - size * 0.62);
      } else if (mood === "happy") {
        ctx.arc(x, y - size * 0.62, size * 0.22, 0, Math.PI);
      } else if (mood === "critical") {
        ctx.arc(x, y - size * 0.52, size * 0.20, Math.PI, Math.PI * 2);
      } else if (mood === "tired") {
        ctx.moveTo(x - size * 0.22, y - size * 0.58);
        ctx.lineTo(x + size * 0.22, y - size * 0.58);
      } else {
        ctx.arc(x, y - size * 0.60, size * 0.18, 0, Math.PI);
      }
      ctx.stroke();

      // 耳朵
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(x - size * 0.5, y - size * 0.9, size * 0.2, size * 0.3, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + size * 0.5, y - size * 0.9, size * 0.2, size * 0.3, 0.5, 0, Math.PI * 2);
      ctx.fill();

      // 角
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x - size * 0.2, y - size * 1.1);
      ctx.lineTo(x - size * 0.15, y - size * 1.3);
      ctx.moveTo(x + size * 0.2, y - size * 1.1);
      ctx.lineTo(x + size * 0.15, y - size * 1.3);
      ctx.stroke();
    }

    function drawHorse(x, y, size) {
      ctx.fillStyle = '#8B4513';
      ctx.beginPath();
      ctx.ellipse(x, y, size * 0.8, size * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(x, y - size * 0.6, size * 0.5, size * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#654321';
      ctx.beginPath();
      ctx.ellipse(x, y - size * 0.8, size * 0.6, size * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.ellipse(x - size * 0.2, y - size * 0.7, size * 0.06, size * 0.08, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + size * 0.2, y - size * 0.7, size * 0.06, size * 0.08, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#8B4513';
      ctx.lineWidth = size * 0.15;
      ctx.beginPath();
      ctx.moveTo(x - size * 0.3, y + size * 0.3);
      ctx.lineTo(x - size * 0.3, y + size * 0.8);
      ctx.moveTo(x + size * 0.3, y + size * 0.3);
      ctx.lineTo(x + size * 0.3, y + size * 0.8);
      ctx.stroke();
    }

    function drawBoss(x, y, size) {
      ctx.fillStyle = '#FF6B6B';
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FF0000';
      ctx.beginPath();
      ctx.ellipse(x - size * 0.4, y - size * 0.2, size * 0.15, size * 0.2, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + size * 0.4, y - size * 0.2, size * 0.15, size * 0.2, 0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#8B0000';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x - size * 0.6, y - size * 0.4);
      ctx.lineTo(x - size * 0.2, y - size * 0.3);
      ctx.moveTo(x + size * 0.6, y - size * 0.4);
      ctx.lineTo(x + size * 0.2, y - size * 0.3);
      ctx.stroke();

      ctx.strokeStyle = '#8B0000';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(x, y + size * 0.2, size * 0.3, 0, Math.PI);
      ctx.stroke();
    }

    // ====== 视觉特效 ======
    function drawCoinIcon(x, y, size) {
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FFA500';
      ctx.beginPath();
      ctx.arc(x, y, size * 0.7, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FFD700';
      ctx.font = `bold ${size}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('¥', x, y);
    }

    function createParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10,
          size: Math.random() * 5 + 2,
          color,
          life: 1
        });
      }
    }

    function createCoinsVisual(x, y, n = 5) {
      for (let i = 0; i < n; i++) {
        coinsVisual.push({
          x, y,
          vx: (Math.random() - 0.5) * 5,
          vy: -Math.random() * 5 - 2,
          size: 14,
          life: 1
        });
      }
    }

    function addFloatText(x, y, text, color = "#e0f7fa") {
      floatTexts.push({
        x, y, text, color,
        vy: -1.2,
        life: 1
      });
    }

    function updateParticles() {
      particles = particles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.5;
        p.life -= 0.02;
        p.size *= 0.98;
        return p.life > 0;
      });
    }

    function updateCoinsVisual() {
      coinsVisual = coinsVisual.filter(c => {
        c.x += c.vx;
        c.y += c.vy;
        c.vy += 0.3;
        c.life -= 0.01;
        return c.life > 0;
      });
    }

    function updateFloatTexts() {
      floatTexts = floatTexts.filter(t => {
        t.y += t.vy;
        t.life -= 0.02;
        return t.life > 0;
      });
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function drawCoinsVisual() {
      coinsVisual.forEach(c => {
        ctx.globalAlpha = c.life;
        drawCoinIcon(c.x, c.y, c.size);
      });
      ctx.globalAlpha = 1;
    }

    function drawFloatTexts() {
      floatTexts.forEach(t => {
        ctx.globalAlpha = t.life;
        ctx.fillStyle = t.color;
        ctx.font = "bold 16px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(t.text, t.x, t.y);
      });
      ctx.globalAlpha = 1;
    }

    // ====== 刷怪：更密度 + 波动 ======
    // 用一个“波动目标数量”，系统会追着这个目标补齐/放缓
    function computeEnemyTarget() {
      // 波动：用两个不同频率的正弦叠加，再加一点随机
      const t = secondsSurvived;
      const wave = Math.sin(t * 0.7) * 0.5 + Math.sin(t * 0.17) * 0.5; // -1..1-ish
      const noise = (Math.random() - 0.5) * 0.9;
      const n = ENEMY_TARGET_MIN + (ENEMY_TARGET_MAX - ENEMY_TARGET_MIN) * (0.5 + 0.35 * wave + 0.15 * noise);
      return Math.max(ENEMY_TARGET_MIN, Math.min(ENEMY_TARGET_MAX, Math.round(n)));
    }

    function spawnEnemy() {
      const side = Math.floor(Math.random() * 4);
      let x, y;
      switch (side) {
        case 0: x = Math.random() * canvas.width; y = -50; break;
        case 1: x = canvas.width + 50; y = Math.random() * canvas.height; break;
        case 2: x = Math.random() * canvas.width; y = canvas.height + 50; break;
        case 3: x = -50; y = Math.random() * canvas.height; break;
      }

      // boss比例稍微降一点：更休闲
      const isBoss = Math.random() < 0.08;

      // 行为分布：一部分追击，一部分游走，一部分远离
      const r = Math.random();
      let mode = MODE_CHASE;
      if (r < 0.52) mode = MODE_CHASE;
      else if (r < 0.82) mode = MODE_WANDER;
      else mode = MODE_FLEE;

      const baseSpeed = isBoss ? 2.0 : 2.2 + difficulty * 0.32;

      enemies.push({
        x, y,
        size: isBoss ? 40 : 25,
        speed: baseSpeed,
        isBoss,
        hp: isBoss ? 3 : 1,
        mode,
        // wander用：随机方向/计时器
        vx: (Math.random() - 0.5) * baseSpeed,
        vy: (Math.random() - 0.5) * baseSpeed,
        wanderTimer: 0
      });
    }

    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

    // ====== 金币指数增长 ======
    function coinMultiplier() {
      // 随时间指数变大（后期疯涨），但给上限避免溢出
      const mult = Math.exp(secondsSurvived / COIN_EXP_K);
      return Math.min(COIN_CAP_MULT, mult);
    }

    function coinGain(isBoss) {
      const base = isBoss ? COIN_BASE_BOSS : COIN_BASE_SMALL;
      // 还叠加一点难度：越后越离谱
      const d = 1 + Math.max(0, difficulty - 1) * 0.12;
      const gain = Math.round(base * coinMultiplier() * d);
      return Math.max(base, gain);
    }

    // ====== 寿命指数减少（前慢后快） ======
    function daysDecayPerSecond() {
      // 指数增长，但受cap约束
      const rate = BASE_DAYS_DECAY_PER_SEC * Math.exp(secondsSurvived / DECAY_GROWTH_K);
      return Math.min(DECAY_MAX_CAP, rate);
    }

    // ====== 表情逻辑（可爱 + 彩蛋邪恶） ======
    function updateMood() {
      const now = performance.now();

      // 彩蛋：非常低概率触发邪恶表情，持续1.2秒（不影响游戏）
      if (now > player.evilUntil && Math.random() < 0.0012) {
        player.evilUntil = now + 1200;
        // 彩蛋时也来一句“呵呵。”（小概率）
        if (Math.random() < 0.35) showDialog("呵呵。");
      }

      if (now < player.evilUntil) {
        player.mood = "evil";
        return;
      }

      if (now < player.happyUntil) {
        player.mood = "happy";
        return;
      }

      const hpRatio = hp / MAX_HP;
      if (hp <= 18) player.mood = "critical";
      else if (hpRatio < 0.45 || difficulty >= 9) player.mood = "tired";
      else player.mood = "calm";
    }

    function rewardForKill(isBoss, x, y) {
      // 回血
      const heal = isBoss ? BOSS_HEAL : SMALL_HEAL;
      hp = clamp(hp + heal, 0, MAX_HP);

      // 得分
      score += isBoss ? 120 : 12;

      // 金币指数增长
      const cg = coinGain(isBoss);
      coinScore += cg;

      // 视觉反馈
      createParticles(x, y, isBoss ? '#FFD700' : '#00FF88', isBoss ? 34 : 20);
      createCoinsVisual(x, y, isBoss ? 10 : 5);
      addFloatText(x, y - 10, `+${heal} HP`, "#92fe9d");
      addFloatText(x, y + 12, `+${cg} 金币`, "#FFD700");

      // 开心表情
      player.happyUntil = performance.now() + 650;
    }

    // ====== 游戏更新 ======
    function update() {
      if (!gameRunning) return;

      // 1) 时间：寿命倒计时（指数加速）
      const now = performance.now();
      if (now - lastSecondTick >= 1000) {
        const secs = Math.floor((now - lastSecondTick) / 1000);

        // 每秒扣 daysDecayPerSecond()（逐渐越来越快）
        // 用分段累计，避免大跳造成不稳定
        for (let i = 0; i < secs; i++) {
          daysLeft -= daysDecayPerSecond();
          secondsSurvived += 1;
        }

        lastSecondTick += secs * 1000;
      }
      if (daysLeft < 0) daysLeft = 0;

      // 2) 玩家位置
      const dx = player.targetX - player.x;
      const dy = player.targetY - player.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      if (distance > 5) {
        player.x += (dx / distance) * player.speed;
        player.y += (dy / distance) * player.speed;
      }

      // 3) 刷怪：目标数量波动 + 以“爆发式补齐”为主（密度高但不稳定）
      const target = computeEnemyTarget();
      const deficit = target - enemies.length;

      // 如果缺口大，就瞬间补几个（制造“突然变多”）
      if (deficit > 0) {
        const burst = Math.min(deficit, 1 + Math.floor(Math.random() * 4)); // 1~4
        for (let i = 0; i < burst; i++) spawnEnemy();
      } else {
        // 如果怪太多，不强行清：让密度自然波动
      }

      // 额外随机“风暴刷怪”：让数量更不稳定
      if (Math.random() < 0.045 + difficulty * 0.002) {
        const extra = 1 + Math.floor(Math.random() * 2);
        for (let i = 0; i < extra; i++) spawnEnemy();
      }

      // 4) 敌人行为：追击/游走/远离
      enemies.forEach((enemy, index) => {
        const px = player.x;
        const py = player.y;

        let vx = 0, vy = 0;

        if (enemy.mode === MODE_CHASE) {
          const dx = px - enemy.x;
          const dy = py - enemy.y;
          const dist = Math.max(0.0001, Math.sqrt(dx * dx + dy * dy));
          vx = (dx / dist) * enemy.speed;
          vy = (dy / dist) * enemy.speed;
        }

        if (enemy.mode === MODE_FLEE) {
          const dx = enemy.x - px;
          const dy = enemy.y - py;
          const dist = Math.max(0.0001, Math.sqrt(dx * dx + dy * dy));
          // 离玩家太近就加速逃
          const boost = dist < 180 ? 1.35 : 1.0;
          vx = (dx / dist) * enemy.speed * boost;
          vy = (dy / dist) * enemy.speed * boost;
        }

        if (enemy.mode === MODE_WANDER) {
          enemy.wanderTimer -= 1;
          if (enemy.wanderTimer <= 0) {
            enemy.wanderTimer = 18 + Math.floor(Math.random() * 28);
            const ang = Math.random() * Math.PI * 2;
            const sp = enemy.speed * (0.55 + Math.random() * 0.75);
            enemy.vx = Math.cos(ang) * sp;
            enemy.vy = Math.sin(ang) * sp;
          }
          vx = enemy.vx;
          vy = enemy.vy;

          // 偶尔轻微被玩家“吸引/排斥”一点点，让它更像活的
          const dx = px - enemy.x;
          const dy = py - enemy.y;
          const dist = Math.max(0.0001, Math.sqrt(dx * dx + dy * dy));
          const bias = (Math.random() < 0.5 ? -1 : 1) * 0.25; // 随机偏向
          vx += (dx / dist) * enemy.speed * 0.08 * bias;
          vy += (dy / dist) * enemy.speed * 0.08 * bias;
        }

        enemy.x += vx;
        enemy.y += vy;

        // 边界反弹（游走更自然）
        if (enemy.mode === MODE_WANDER) {
          if (enemy.x < -40 || enemy.x > canvas.width + 40) enemy.vx *= -1;
          if (enemy.y < -40 || enemy.y > canvas.height + 40) enemy.vy *= -1;
        }

        // 碰撞检测
        const ddx = player.x - enemy.x;
        const ddy = player.y - enemy.y;
        const d = Math.sqrt(ddx * ddx + ddy * ddy);
        if (d < player.size + enemy.size) {
          // 扣血更少（休闲）
          hp -= enemy.isBoss ? BOSS_DAMAGE : SMALL_DAMAGE;
          hp = clamp(hp, 0, MAX_HP);

          if (enemy.isBoss) {
            enemy.hp--;
            if (enemy.hp <= 0) {
              rewardForKill(true, enemy.x, enemy.y);
              enemies.splice(index, 1);
            }
          } else {
            rewardForKill(false, enemy.x, enemy.y);
            enemies.splice(index, 1);
          }
        }
      });

      // 5) 难度：更慢更休闲
      difficulty = Math.floor(score / 180) + 1;

      // 6) 粒子更新
      updateParticles();
      updateCoinsVisual();
      updateFloatTexts();
      updateMood();

      // 7) 台词
      updateDialog();

      // 8) 奶瓶：不断出现/消失（最多5个）
      // 出现更频繁：越后期越勤奋（更快产奶）
      const spawnInterval = Math.max(0.45, 1.15 - secondsSurvived / 420); // 秒
      const despawnInterval = Math.max(0.8, 1.8 - secondsSurvived / 620); // 秒

      bottleSpawnTimer += 1/60;
      bottleDespawnTimer += 1/60;

      if (bottleSpawnTimer >= spawnInterval) {
        bottleSpawnTimer = 0;
        spawnBottleFromRight();
      }
      if (bottleDespawnTimer >= despawnInterval) {
        bottleDespawnTimer = 0;
        despawnBottleFromLeft();
      }
      renderBottles();

      // 9) UI
      document.getElementById('daysLeft').textContent = Math.floor(daysLeft);
      document.getElementById('hp').textContent = Math.floor(hp);
      document.getElementById('difficulty').textContent = difficulty;
      document.getElementById('coinScore').textContent = coinScore;

      // 10) 游戏结束：寿命或HP归零
      if (daysLeft <= 0 || hp <= 0) gameOver();
    }

    function draw() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 流汗：更轻微（休闲）
      if ((player.mood === "tired" || player.mood === "critical") && Math.random() < 0.22) {
        ctx.fillStyle = '#87CEEB';
        ctx.beginPath();
        ctx.arc(player.x - player.size * 0.8, player.y - player.size * 0.5, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      drawCow(player.x, player.y, player.size, player.mood);

      enemies.forEach(enemy => {
        if (enemy.isBoss) drawBoss(enemy.x, enemy.y, enemy.size);
        else drawHorse(enemy.x, enemy.y, enemy.size);
      });

      drawParticles();
      drawCoinsVisual();
      drawFloatTexts();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function gameOver() {
      gameRunning = false;
      document.getElementById('finalScore').textContent = score;
      document.getElementById('finalCoins').textContent = coinScore;
      document.getElementById('finalSeconds').textContent = secondsSurvived;
      gameOverPanel.style.display = 'block';
    }

    function restart() {
      player.x = canvas.width / 2;
      player.y = canvas.height / 2;
      player.targetX = canvas.width / 2;
      player.targetY = canvas.height / 2;
      player.mood = "calm";
      player.happyUntil = 0;
      player.evilUntil = 0;

      enemies = [];
      particles = [];
      coinsVisual = [];
      floatTexts = [];

      daysLeft = INITIAL_DAYS;
      hp = MAX_HP;
      score = 0;
      coinScore = 0;
      difficulty = 1;
      secondsSurvived = 0;

      lastSecondTick = performance.now();
      lastDialogTime = 0;

      dialogBox.style.display = "none";
      if (dialogHideTimer) { clearTimeout(dialogHideTimer); dialogHideTimer = null; }

      // 奶瓶重置
      bottles = [0,0,0,0,0];
      bottleSpawnTimer = 0;
      bottleDespawnTimer = 0;
      renderBottles();

      gameRunning = true;
      gameOverPanel.style.display = 'none';
    }

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      player.targetX = e.clientX - rect.left;
      player.targetY = e.clientY - rect.top;
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      player.targetX = touch.clientX - rect.left;
      player.targetY = touch.clientY - rect.top;
    }, { passive: false });

    restartBtn.addEventListener('click', restart);

    // 初始化奶瓶架外观
    renderBottles();

    // 开始
    gameLoop();
  </script>
</body>
</html>
