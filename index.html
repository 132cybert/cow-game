<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>职场模拟器：从实习生到诸天万界总裁</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #gameInfo {
      position: absolute;
      top: 20px;
      width: 90%;
      max-width: 820px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      background: rgba(255, 255, 255, 0.15);
      padding: 14px 22px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #e0f7fa;
      font-size: 16px;
      font-weight: bold;
      z-index: 10;
      flex-wrap: wrap;
    }

    #gameCanvas {
      border: 2px solid rgba(173, 216, 230, 0.5);
      border-radius: 15px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      background: rgba(255, 255, 255, 0.05);
      touch-action: none;
    }

    /* 对话框 */
    #dialogBox {
      position: absolute;
      bottom: 38px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #e0f7fa;
      padding: 14px 22px;
      border-radius: 20px;
      font-size: 16px;
      max-width: min(820px, 78%);
      text-align: center;
      display: none;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 20px rgba(0, 200, 255, 0.35);
      border: 1px solid rgba(255,255,255,0.16);
      line-height: 1.45;
      z-index: 50;
    }

    #gameOverPanel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(30, 30, 50, 0.9);
      padding: 40px;
      border-radius: 25px;
      text-align: center;
      display: none;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      z-index: 100;
      min-width: 340px;
    }

    #gameOverPanel h2 {
      color: #e0f7fa;
      font-size: 30px;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(0, 200, 255, 0.7);
      line-height: 1.25;
    }

    #gameOverPanel .subtitle {
      color: rgba(224, 247, 250, 0.8);
      font-size: 14px;
      margin-bottom: 18px;
      letter-spacing: 0.2px;
    }

    #gameOverPanel p {
      color: #bbdefb;
      font-size: 18px;
      margin: 10px 0;
    }

    #restartBtn {
      margin-top: 22px;
      padding: 14px 38px;
      font-size: 16px;
      background: linear-gradient(45deg, #00c9ff, #92fe9d);
      color: #0a1929;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.25s;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(0, 201, 255, 0.4);
    }

    #restartBtn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(0, 201, 255, 0.6);
    }
  </style>
</head>

<body>
  <div id="gameInfo">
    <div>剩余寿命: <span id="daysLeft">21346</span> 天</div>
    <div>生命值(HP): <span id="hp">100</span></div>
    <div>难度: <span id="difficulty">1</span></div>
    <div>金币积分: <span id="coinScore">0</span></div>
  </div>

  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <!-- 对话框 -->
  <div id="dialogBox"></div>

  <div id="gameOverPanel">
    <h2>职场模拟器：本轮历练结束</h2>
    <div class="subtitle">Corporate Ascension Simulator — From Intern to Multiverse CEO</div>
    <p>最终得分: <span id="finalScore">0</span></p>
    <p>金币积分: <span id="finalCoins">0</span></p>
    <p>存活时长: <span id="finalSeconds">0</span> 秒</p>
    <button id="restartBtn">重新开始</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameOverPanel = document.getElementById('gameOverPanel');
    const restartBtn = document.getElementById('restartBtn');
    const dialogBox = document.getElementById('dialogBox');

    // ====== 核心资源：寿命(不可恢复) + HP(可恢复) ======
    const INITIAL_DAYS = 21346;
    const MAX_HP = 100;

    const DAYS_DECAY_PER_SEC = 1;   // 每秒寿命 -1 天（想更残酷就改成2）
    const SMALL_DAMAGE = 8;         // 小怪贴脸扣血
    const BOSS_DAMAGE = 18;         // Boss贴脸扣血

    const SMALL_HEAL = 12;          // 打小怪回血
    const BOSS_HEAL = 35;           // 打Boss回血

    const SMALL_COIN = 1;
    const BOSS_COIN = 5;

    let player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      size: 30,
      speed: 5,
      targetX: canvas.width / 2,
      targetY: canvas.height / 2,
      // 表情状态：calm | tired | critical | happy
      mood: "calm",
      happyUntil: 0
    };

    let enemies = [];
    let particles = [];
    let coins = [];       // 仅视觉金币粒子
    let floatTexts = [];  // 浮动文字

    let daysLeft = INITIAL_DAYS; // 倒计时：只会减少
    let hp = MAX_HP;             // 可回复：生命值
    let score = 0;
    let coinScore = 0;
    let difficulty = 1;
    let gameRunning = true;

    // 用于“每秒扣寿命”
    let lastSecondTick = performance.now();
    let secondsSurvived = 0;

    // ====== 台词系统（早/中/后）======
    const earlyLines = [
      "第一天上班……为什么空气都这么压抑。",
      "我是不是选错专业了？",
      "再坚持一下……也许明年会涨薪。",
      "为什么他们都跑得比我快？",
      "这任务真的合理吗？",
      "今天又要加班吗？",
      "好累……但不敢停。",
      "别人好像都很厉害。",
      "是不是只有我不会？",
      "先活下来再说。",
      "老板看我一眼，我血压就上来了。",
      "努力是不是一定有用？",
      "我只是想按时下班。",
      "怎么又改需求？",
      "我只是个实习生啊……",
      "我能不能……先喝口水再崩溃。",
      "会议像黑洞：吞噬时间，吐出KPI。",
      "我在工位上学会了瞬移：从周一瞬到周五。"
    ];

    const midLines = [
      "原来规则不是写给我这种人的。",
      "我开始看懂他们的逻辑了。",
      "原来权力，是结构。",
      "原来不是我不行，是游戏有问题。",
      "我不再焦虑，我开始计算。",
      "他们怕的不是我努力，是我清醒。",
      "资源流向强者。",
      "我开始收集变量。",
      "情绪是成本。",
      "耐心，是我的武器。",
      "我已经不一样了。",
      "再等一会儿。",
      "今天我不反驳，我只记录。",
      "当我不再解释，我就开始赢。",
      "我把加班当训练：练的是心硬。"
    ];

    // 你给的“后期爽文系统台词”（轻微排版润色）
    const lateLines = [
      "五年前，我在底层挨耳光；五年后，我坐在董事办公室——这一巴掌，利息十亿。",
      "年会抽中了特等奖：总裁体验卡（永久）。",
      "【恭喜宿主完成十万次摸鱼签到，奖励：整个集团控股权】",
      "带薪拉屎的我，拉出一座商业帝国。",
      "这栋楼太小，本座的目标是收购因果律。",
      "本座之言，便是群公告；本座之怒，便是服务器崩溃！",
      "曾经我为PPT动画加班秃头，如今我的PPT自带天道威压，投资人看了当场打款十个亿！",
      "我即天道，我即规则，我即职场本身！",
      "签到一百年，我成了职场天道。",
      "我有一剑，可斩星辰；我有一键，可让全楼断电！",
      "被裁员那天，我绑定了职场神豪系统。",
      "天若阻我，我便不出门；地若拦我，我便收购这地！"
    ];

    // 对话频率控制
    let lastDialogTime = 0;
    const DIALOG_MIN_INTERVAL_MS = 8000; // 至少 8 秒一次
    const DIALOG_SHOW_MS = 3200;         // 显示时长
    let dialogHideTimer = null;

    function showDialog(text) {
      // 清理旧计时器，避免重叠
      if (dialogHideTimer) {
        clearTimeout(dialogHideTimer);
        dialogHideTimer = null;
      }
      dialogBox.textContent = text;
      dialogBox.style.display = "block";
      dialogHideTimer = setTimeout(() => {
        dialogBox.style.display = "none";
      }, DIALOG_SHOW_MS);
    }

    function randomLine(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    // 触发规则：按生存时间分段（你可以改成按difficulty/score）
    function updateDialog() {
      const now = performance.now();
      if (now - lastDialogTime < DIALOG_MIN_INTERVAL_MS) return;

      // 一点“概率”，避免太密集：早期更常见，后期稍微稀一点更像“天道发言”
      const chance = secondsSurvived < 60 ? 0.75 : (secondsSurvived < 180 ? 0.6 : 0.45);
      if (Math.random() > chance) return;

      if (secondsSurvived < 60) {
        showDialog(randomLine(earlyLines));
      } else if (secondsSurvived < 180) {
        showDialog(randomLine(midLines));
      } else {
        showDialog(randomLine(lateLines));
      }

      lastDialogTime = now;
    }

    // ====== 绘制：奶牛（带表情）======
    function drawCow(x, y, size, mood) {
      // 身体
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(x, y, size, size * 0.8, 0, 0, Math.PI * 2);
      ctx.fill();

      // 斑点
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.ellipse(x - size * 0.3, y - size * 0.2, size * 0.15, size * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + size * 0.2, y + size * 0.3, size * 0.2, size * 0.15, 0, 0, Math.PI * 2);
      ctx.fill();

      // 头部
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(x, y - size * 0.7, size * 0.7, size * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();

      // 眼睛：疲惫/濒危更“眯”
      ctx.fillStyle = '#000000';
      const eyeW = size * 0.08;
      const eyeH =
        mood === "critical" ? size * 0.025 :
        mood === "tired" ? size * 0.035 :
        size * 0.05;
      const eyeY = y - size * 0.8;

      ctx.beginPath();
      ctx.ellipse(x - size * 0.3, eyeY, eyeW, eyeH, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + size * 0.3, eyeY, eyeW, eyeH, 0, 0, Math.PI * 2);
      ctx.fill();

      // 眼袋
      if (mood === "tired" || mood === "critical") {
        ctx.strokeStyle = 'rgba(0,0,0,0.35)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x - size * 0.3, eyeY + size * 0.08, size * 0.08, 0, Math.PI);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x + size * 0.3, eyeY + size * 0.08, size * 0.08, 0, Math.PI);
        ctx.stroke();
      }

      // 嘴巴：happy 微笑 / tired 平直 / critical 苦脸
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2;
      ctx.beginPath();
      if (mood === "happy") {
        ctx.arc(x, y - size * 0.62, size * 0.22, 0, Math.PI);
      } else if (mood === "critical") {
        ctx.arc(x, y - size * 0.52, size * 0.20, Math.PI, Math.PI * 2);
      } else if (mood === "tired") {
        ctx.moveTo(x - size * 0.22, y - size * 0.58);
        ctx.lineTo(x + size * 0.22, y - size * 0.58);
      } else {
        ctx.arc(x, y - size * 0.60, size * 0.18, 0, Math.PI);
      }
      ctx.stroke();

      // 耳朵
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(x - size * 0.5, y - size * 0.9, size * 0.2, size * 0.3, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + size * 0.5, y - size * 0.9, size * 0.2, size * 0.3, 0.5, 0, Math.PI * 2);
      ctx.fill();

      // 角
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x - size * 0.2, y - size * 1.1);
      ctx.lineTo(x - size * 0.15, y - size * 1.3);
      ctx.moveTo(x + size * 0.2, y - size * 1.1);
      ctx.lineTo(x + size * 0.15, y - size * 1.3);
      ctx.stroke();
    }

    // 小马敌人
    function drawHorse(x, y, size) {
      ctx.fillStyle = '#8B4513';
      ctx.beginPath();
      ctx.ellipse(x, y, size * 0.8, size * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(x, y - size * 0.6, size * 0.5, size * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#654321';
      ctx.beginPath();
      ctx.ellipse(x, y - size * 0.8, size * 0.6, size * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.ellipse(x - size * 0.2, y - size * 0.7, size * 0.06, size * 0.08, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + size * 0.2, y - size * 0.7, size * 0.06, size * 0.08, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#8B4513';
      ctx.lineWidth = size * 0.15;
      ctx.beginPath();
      ctx.moveTo(x - size * 0.3, y + size * 0.3);
      ctx.lineTo(x - size * 0.3, y + size * 0.8);
      ctx.moveTo(x + size * 0.3, y + size * 0.3);
      ctx.lineTo(x + size * 0.3, y + size * 0.8);
      ctx.stroke();
    }

    // Boss
    function drawBoss(x, y, size) {
      ctx.fillStyle = '#FF6B6B';
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FF0000';
      ctx.beginPath();
      ctx.ellipse(x - size * 0.4, y - size * 0.2, size * 0.15, size * 0.2, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x + size * 0.4, y - size * 0.2, size * 0.15, size * 0.2, 0.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#8B0000';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x - size * 0.6, y - size * 0.4);
      ctx.lineTo(x - size * 0.2, y - size * 0.3);
      ctx.moveTo(x + size * 0.6, y - size * 0.4);
      ctx.lineTo(x + size * 0.2, y - size * 0.3);
      ctx.stroke();

      ctx.strokeStyle = '#8B0000';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(x, y + size * 0.2, size * 0.3, 0, Math.PI);
      ctx.stroke();
    }

    // 金币（视觉）
    function drawCoin(x, y, size) {
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FFA500';
      ctx.beginPath();
      ctx.arc(x, y, size * 0.7, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FFD700';
      ctx.font = `bold ${size}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('¥', x, y);
    }

    // 粒子
    function createParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10,
          size: Math.random() * 5 + 2,
          color,
          life: 1
        });
      }
    }

    // 视觉金币喷射
    function createCoins(x, y, n = 5) {
      for (let i = 0; i < n; i++) {
        coins.push({
          x, y,
          vx: (Math.random() - 0.5) * 5,
          vy: -Math.random() * 5 - 2,
          size: 14,
          life: 1
        });
      }
    }

    // 浮动文字
    function addFloatText(x, y, text, color = "#e0f7fa") {
      floatTexts.push({
        x, y,
        text,
        color,
        vy: -1.2,
        life: 1
      });
    }

    function updateParticles() {
      particles = particles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.5;
        p.life -= 0.02;
        p.size *= 0.98;
        return p.life > 0;
      });
    }

    function updateCoins() {
      coins = coins.filter(c => {
        c.x += c.vx;
        c.y += c.vy;
        c.vy += 0.3;
        c.life -= 0.01;
        return c.life > 0;
      });
    }

    function updateFloatTexts() {
      floatTexts = floatTexts.filter(t => {
        t.y += t.vy;
        t.life -= 0.02;
        return t.life > 0;
      });
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function drawCoins() {
      coins.forEach(c => {
        ctx.globalAlpha = c.life;
        drawCoin(c.x, c.y, c.size);
      });
      ctx.globalAlpha = 1;
    }

    function drawFloatTexts() {
      floatTexts.forEach(t => {
        ctx.globalAlpha = t.life;
        ctx.fillStyle = t.color;
        ctx.font = "bold 16px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(t.text, t.x, t.y);
      });
      ctx.globalAlpha = 1;
    }

    // 生成敌人
    function spawnEnemy() {
      const side = Math.floor(Math.random() * 4);
      let x, y;
      switch (side) {
        case 0: x = Math.random() * canvas.width; y = -50; break;
        case 1: x = canvas.width + 50; y = Math.random() * canvas.height; break;
        case 2: x = Math.random() * canvas.width; y = canvas.height + 50; break;
        case 3: x = -50; y = Math.random() * canvas.height; break;
      }

      const isBoss = Math.random() < 0.1;
      enemies.push({
        x, y,
        size: isBoss ? 40 : 25,
        speed: isBoss ? 2 : 3 + difficulty * 0.5,
        isBoss,
        hp: isBoss ? 3 : 1
      });
    }

    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

    // 表情逻辑：低HP/高难度 => tired/critical；击杀短暂 happy
    function updateMood() {
      const now = performance.now();
      if (now < player.happyUntil) {
        player.mood = "happy";
        return;
      }
      const hpRatio = hp / MAX_HP;
      if (hp <= 18) player.mood = "critical";
      else if (hpRatio < 0.45 || difficulty >= 6) player.mood = "tired";
      else player.mood = "calm";
    }

    function rewardForKill(isBoss, x, y) {
      if (isBoss) {
        hp = clamp(hp + BOSS_HEAL, 0, MAX_HP);
        score += 100;
        coinScore += BOSS_COIN;

        createParticles(x, y, '#FFD700', 30);
        createCoins(x, y, 8);
        addFloatText(x, y - 10, `+${BOSS_HEAL} HP`, "#92fe9d");
        addFloatText(x, y + 12, `+${BOSS_COIN} 金币`, "#FFD700");
      } else {
        hp = clamp(hp + SMALL_HEAL, 0, MAX_HP);
        score += 10;
        coinScore += SMALL_COIN;

        createParticles(x, y, '#00FF88', 20);
        createCoins(x, y, 4);
        addFloatText(x, y - 10, `+${SMALL_HEAL} HP`, "#92fe9d");
        addFloatText(x, y + 12, `+${SMALL_COIN} 金币`, "#FFD700");
      }

      // 开心表情 0.8s
      player.happyUntil = performance.now() + 800;
    }

    // 更新游戏
    function update() {
      if (!gameRunning) return;

      // 1) 寿命倒计时（不可恢复）
      const now = performance.now();
      if (now - lastSecondTick >= 1000) {
        const secs = Math.floor((now - lastSecondTick) / 1000);
        daysLeft -= secs * DAYS_DECAY_PER_SEC;
        secondsSurvived += secs;
        lastSecondTick += secs * 1000;
      }
      if (daysLeft < 0) daysLeft = 0;

      // 2) 更新玩家位置
      const dx = player.targetX - player.x;
      const dy = player.targetY - player.y;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance > 5) {
        player.x += (dx / distance) * player.speed;
        player.y += (dy / distance) * player.speed;
      }

      // 3) 更新敌人追击 + 碰撞
      enemies.forEach((enemy, index) => {
        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        enemy.x += (dx / distance) * enemy.speed;
        enemy.y += (dy / distance) * enemy.speed;

        // 碰撞：扣HP；击杀回血
        if (distance < player.size + enemy.size) {
          hp -= enemy.isBoss ? BOSS_DAMAGE : SMALL_DAMAGE;
          hp = clamp(hp, 0, MAX_HP);

          if (enemy.isBoss) {
            enemy.hp--;
            if (enemy.hp <= 0) {
              rewardForKill(true, enemy.x, enemy.y);
              enemies.splice(index, 1);
            }
          } else {
            rewardForKill(false, enemy.x, enemy.y);
            enemies.splice(index, 1);
          }
        }
      });

      // 4) 难度
      difficulty = Math.floor(score / 100) + 1;

      // 5) 生成新敌人
      if (Math.random() < Math.min(0.18, 0.02 * difficulty)) {
        spawnEnemy();
      }

      // 6) 粒子/金币/浮字更新
      updateParticles();
      updateCoins();
      updateFloatTexts();
      updateMood();

      // 7) 台词系统更新（放在UI前后都行）
      updateDialog();

      // 8) 更新UI
      document.getElementById('daysLeft').textContent = Math.floor(daysLeft);
      document.getElementById('hp').textContent = Math.floor(hp);
      document.getElementById('difficulty').textContent = difficulty;
      document.getElementById('coinScore').textContent = coinScore;

      // 9) 游戏结束：寿命归零 或 HP归零
      if (daysLeft <= 0 || hp <= 0) {
        gameOver();
      }
    }

    // 绘制游戏
    function draw() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 流汗：HP低/疲惫时更明显
      if ((player.mood === "tired" || player.mood === "critical") && Math.random() < 0.35) {
        ctx.fillStyle = '#87CEEB';
        ctx.beginPath();
        ctx.arc(player.x - player.size * 0.8, player.y - player.size * 0.5, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      // 玩家
      drawCow(player.x, player.y, player.size, player.mood);

      // 敌人
      enemies.forEach(enemy => {
        if (enemy.isBoss) drawBoss(enemy.x, enemy.y, enemy.size);
        else drawHorse(enemy.x, enemy.y, enemy.size);
      });

      // 视觉效果
      drawParticles();
      drawCoins();
      drawFloatTexts();
    }

    // 游戏循环
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // 游戏结束
    function gameOver() {
      gameRunning = false;
      document.getElementById('finalScore').textContent = score;
      document.getElementById('finalCoins').textContent = coinScore;
      document.getElementById('finalSeconds').textContent = secondsSurvived;
      gameOverPanel.style.display = 'block';
    }

    // 重新开始
    function restart() {
      player.x = canvas.width / 2;
      player.y = canvas.height / 2;
      player.targetX = canvas.width / 2;
      player.targetY = canvas.height / 2;
      player.mood = "calm";
      player.happyUntil = 0;

      enemies = [];
      particles = [];
      coins = [];
      floatTexts = [];

      daysLeft = INITIAL_DAYS;
      hp = MAX_HP;
      score = 0;
      coinScore = 0;
      difficulty = 1;
      secondsSurvived = 0;

      lastSecondTick = performance.now();
      lastDialogTime = 0;
      dialogBox.style.display = "none";
      if (dialogHideTimer) {
        clearTimeout(dialogHideTimer);
        dialogHideTimer = null;
      }

      gameRunning = true;
      gameOverPanel.style.display = 'none';
    }

    // 控制
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      player.targetX = e.clientX - rect.left;
      player.targetY = e.clientY - rect.top;
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touch = e.touches[0];
      player.targetX = touch.clientX - rect.left;
      player.targetY = touch.clientY - rect.top;
    }, { passive: false });

    restartBtn.addEventListener('click', restart);

    // 开始
    gameLoop();
  </script>
</body>
</html>
